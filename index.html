<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAUNA AWARD</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SAUNA AWARD">
<meta name="theme-color" content="#0A0908">
<style>
@import url('https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600&family=Noto+Sans+JP:wght@400;500;700;900&display=swap');

:root{
  --ink:#0A0908; --ink-soft:#141210;
  --paper:#FFFFFF; --paper-dim:rgba(255,255,255,.62);
  --gray:#9A9A9A;
  --line:rgba(255,255,255,.14);
  --gold:#D9C27A;
  --gold-grad:linear-gradient(180deg,#F0D98F 0%,#D9BE6E 40%,#A9812F 100%);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink); color:var(--paper);
  font-family:'Noto Sans JP','Helvetica Neue',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
/* サウナシュラン風: 細身ジオメトリックの英字 */
.mq-font{font-family:'Jost','Helvetica Neue',sans-serif;font-weight:300;letter-spacing:.14em;}
.eyebrow{font-family:'Jost',sans-serif;font-weight:300;letter-spacing:.32em;text-transform:uppercase;font-size:11px;color:var(--paper-dim);}
/* 金のグラデーション数字 */
.num-gold{
  font-family:'Jost',sans-serif;font-weight:500;line-height:.9;
  background:var(--gold-grad);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
/* 極太ローマ字施設名 */
.romaji{
  font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
  font-weight:800;text-transform:uppercase;
  line-height:1.06;letter-spacing:.005em;color:#fff;
}
/* 和名 */
.waname{font-family:'Noto Sans JP',sans-serif;font-weight:700;color:#fff;}

/* SAUNACHELIN風ワードマーク: 細身・大トラッキング・金 */
.brand{
  font-family:'Jost','Helvetica Neue',sans-serif;
  font-weight:500;text-transform:uppercase;
  letter-spacing:.3em;line-height:1.3;
  background:var(--gold-grad);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}

/* 各サウナ写真の上を流れるティッカー */
.hero-ticker{
  position:absolute;top:8px;left:0;right:0;z-index:1;
  overflow:hidden;pointer-events:none;
}
.hero-ticker .marquee-track span{
  font-size:14px;font-weight:200;letter-spacing:.12em;
  color:rgba(255,255,255,.6);
  text-shadow:0 1px 8px rgba(0,0,0,.3);
}

/* トップ/AWARD/設定画面の背景画像レイヤー */
#bgimg{
  position:fixed;inset:0;z-index:-1;display:none;
  background-size:cover;background-position:center;
}
#bgimg.on{display:block;}
#bgimg::after{
  content:"";position:absolute;inset:0;
  background:rgba(5,4,3,.6);
}

.btn{
  font-family:'Jost',sans-serif;font-weight:400;letter-spacing:.35em;text-transform:uppercase;
  background:transparent;color:var(--paper);border:1px solid rgba(255,255,255,.45);
  border-radius:999px;padding:16px 20px;width:100%;font-size:14px;cursor:pointer;
  transition:background .25s,color .25s;
}
.btn:active{background:var(--paper);color:var(--ink);}

/* ボタンの設定: ブラック / ホワイト（背景を透かした すりガラス調）
   .btn（メニュー/設定/TIER）に加え .tool-btn（各種設定ボタン）にも適用。
   #root 内に限定し、ポップアップ（#modal/#cropper）には反映しない。
   transition:none で画面遷移直後に色が変わって見える現象を防ぐ */
body.btn-black #root .btn,
body.btn-black #root .tool-btn{
  background:rgba(0,0,0,.3);
  border-color:rgba(255,255,255,.4);
  transition:none;
}
body.btn-black #root .btn:active{background:var(--paper);color:var(--ink);}
body.btn-white #root .btn,
body.btn-white #root .tool-btn{
  background:rgba(255,255,255,.45);
  border-color:rgba(255,255,255,.75);
  color:var(--ink) !important; /* インラインの文字色指定より優先し、トップ画面「設定」も黒に統一 */
  transition:none;
}
/* ホワイト時はボタン内のすべての文字を黒に（金のTier数字はグラデーションのまま） */
body.btn-white #root .btn *,
body.btn-white #root .tool-btn *{color:var(--ink) !important;}
body.btn-white #root .btn:active{background:rgba(0,0,0,.4);color:var(--paper);}
.back{
  font-family:'Jost',sans-serif;font-weight:300;letter-spacing:.3em;font-size:11px;
  color:var(--paper-dim);background:none;border:none;cursor:pointer;padding:8px 0;
}
.file-input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.file-label{display:block;cursor:pointer;}
@keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.marquee{overflow:hidden;padding:12px 0;}
.marquee.lined{border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.marquee-track{display:inline-flex;white-space:nowrap;animation:marquee 28s linear infinite;}
.marquee-track span{
  font-family:'Jost',sans-serif;font-weight:300;letter-spacing:.14em;
  font-size:15px;color:rgba(255,255,255,.78);padding-right:32px;
}
@media (prefers-reduced-motion:reduce){.marquee-track{animation:none;}}
@keyframes fadein{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.fade{animation:fadein .5s ease both;}
@media (prefers-reduced-motion:reduce){.fade{animation:none;}}
.tinput{
  width:100%;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.35);
  color:var(--paper);font-family:'Noto Sans JP',sans-serif;font-size:16px;padding:10px 2px;
}
.tinput:focus{outline:none;border-bottom-color:var(--paper);}
.tinput::placeholder{color:rgba(255,255,255,.28);}
.flabel{font-family:'Jost',sans-serif;font-weight:300;letter-spacing:.28em;font-size:10px;color:var(--paper-dim);text-transform:uppercase;}
.save-btn{
  font-family:'Jost',sans-serif;font-weight:500;letter-spacing:.35em;text-transform:uppercase;font-size:12px;
  background:var(--paper);color:var(--ink);border:1px solid var(--paper);border-radius:999px;padding:12px 28px;cursor:pointer;
}
.save-btn:disabled{opacity:.4;}
.tool-btn{
  font-family:'Jost',sans-serif;font-weight:300;letter-spacing:.22em;text-transform:uppercase;font-size:11px;
  background:transparent;color:var(--paper-dim);border:1px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer;
}
.status{font-family:'Jost',sans-serif;font-weight:300;font-size:10px;letter-spacing:.25em;}
.banner{padding:8px 16px;text-align:center;background:#2A1F12;border-bottom:1px solid var(--line);font-size:11px;color:#D9B36A;letter-spacing:.12em;}

/* --- Tier表示: サウナシュラン風エントリー --- */
.hero{
  position:relative;width:100%;min-height:130vw;max-height:640px;
  background-size:cover;background-position:center;background-color:var(--ink-soft);
  display:flex;flex-direction:column;justify-content:flex-end;
  overflow:hidden;
}
.hero::after{ /* 下部の可読性を上げる薄いグラデーション */
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.28) 78%,rgba(0,0,0,.5) 100%);
  pointer-events:none;
}
.hero-inner{position:relative;z-index:1;padding:0 22px 28px;}
.hero-num{
  position:absolute;z-index:1;top:16%;left:22px;
  font-size:clamp(64px,17vw,110px);
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.35));
}
.hero .romaji{font-size:clamp(30px,8.6vw,52px);text-shadow:0 2px 14px rgba(0,0,0,.45);margin:0;}
.hero .waname{font-size:clamp(17px,4.8vw,24px);margin:14px 0 0;text-shadow:0 1px 10px rgba(0,0,0,.45);}
.detail-link{
  display:inline-block;margin-top:22px;
  font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:15px;
  color:var(--gold);text-decoration:underline;text-underline-offset:5px;
}
/* --- 画像切り抜きモーダル --- */
#cropper{
  position:fixed;inset:0;z-index:50;display:none;
  background:rgba(5,4,3,.97);
  flex-direction:column;align-items:center;justify-content:center;padding:20px;
}
#cropper.open{display:flex;}
.crop-note{font-family:'Noto Sans JP',sans-serif;font-size:12px;color:var(--paper-dim);letter-spacing:.1em;margin:0 0 14px;text-align:center;line-height:1.8;}
.crop-frame{
  position:relative;overflow:hidden;background:#000;
  border:1px solid rgba(255,255,255,.4);
  touch-action:none;cursor:grab;
}
.crop-frame img{
  position:absolute;top:0;left:0;max-width:none;
  user-select:none;-webkit-user-drag:none;pointer-events:none;
}
.crop-zoom{width:100%;max-width:380px;margin-top:18px;accent-color:#D9C27A;}
.crop-actions{display:flex;gap:12px;margin-top:18px;width:100%;max-width:380px;}

/* --- ミニ写真（URL下を流れるフィルムストリップ） --- */
.mini-strip{overflow:hidden;margin-top:22px;}
.mini-track{display:inline-flex;animation:marquee 32s linear infinite;}
.mini-track img{height:150px;width:auto;display:block;margin-right:6px;}
/* ミニ写真は「どんな時でも流れる」仕様のため reduced-motion でも停止しない */
.mini-pick{
  width:100%;aspect-ratio:4/3;background:var(--ink-soft);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  border:1px dashed rgba(255,255,255,.3);
}
.mini-pick img{width:100%;height:100%;object-fit:cover;display:block;}
.mini-del{
  font-family:'Jost',sans-serif;font-weight:300;letter-spacing:.2em;font-size:10px;
  color:var(--paper-dim);background:none;border:none;cursor:pointer;padding:6px 0 0;width:100%;
}

/* --- 確認ポップアップ --- */
#modal{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(5,4,3,.9);
  align-items:center;justify-content:center;padding:28px;
}
#modal.open{display:flex;}
.modal-box{
  background:#181512;border:1px solid var(--line);
  max-width:380px;width:100%;padding:26px 22px;text-align:center;
}
.modal-msg{font-family:'Noto Sans JP',sans-serif;font-size:14px;line-height:2;color:var(--paper);margin:0 0 20px;}
.modal-actions{display:flex;gap:12px;}

/* Address / URL ブロック（写真2枚目風） */
.meta{padding:26px 22px 8px;}
.meta .mlabel{
  font-family:'Jost',sans-serif;font-weight:300;letter-spacing:.12em;
  font-size:15px;color:var(--gray);margin:18px 0 6px;
}
.meta .mval{
  font-family:'Noto Sans JP',sans-serif;font-weight:500;font-size:17px;
  color:#fff;margin:0;line-height:1.7;word-break:break-all;
}
.meta a.mval{color:#fff;text-decoration:underline;text-underline-offset:5px;}

.empty-frame{
  width:100%;aspect-ratio:4/3;border:1px dashed rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
}
.pick-frame{
  width:100%;aspect-ratio:10/13;background:var(--ink-soft);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
img.entry{width:100%;height:100%;object-fit:cover;display:block;}

/* =====================================================================
   DAIALY / ARCHIVE（ver3.0で追加）— 本体と衝突しないよう x- 接頭辞で統一
   ===================================================================== */
:root{--sun:#D98A7E;--sat:#8FA9C9;}
@keyframes xFade{from{opacity:0;}to{opacity:1;}}
@keyframes xSlideNext{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:none;}}
@keyframes xSlidePrev{from{opacity:0;transform:translateX(-40px);}to{opacity:1;transform:none;}}
.x-fade{animation:xFade .35s ease both;}
.x-slide-next{animation:xSlideNext .28s ease both;}
.x-slide-prev{animation:xSlidePrev .28s ease both;}
@media (prefers-reduced-motion:reduce){.x-fade,.x-slide-next,.x-slide-prev{animation:none;}}
.x-link{background:none;border:none;color:var(--gold);font-family:'Noto Sans JP',sans-serif;font-size:12px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:6px 0;}
.x-bar{width:3px;border-radius:2px;background:var(--gold-grad);flex:none;align-self:stretch;}
.x-etext{display:flex;flex-direction:column;min-width:0;gap:4px;}
.x-nm{font-weight:700;font-size:15px;line-height:1.5;word-break:break-word;}
.x-lc{font-size:12px;color:var(--paper-dim);display:flex;align-items:center;gap:4px;line-height:1.5;}
.x-lc svg{width:12px;height:12px;flex:none;}
.x-warn{color:#D9A27A;}
.x-thumb{width:64px;aspect-ratio:3/2;object-fit:cover;border-radius:6px;flex:none;display:block;background:var(--ink-soft);}
.x-thumb.ph{display:flex;align-items:center;justify-content:center;color:var(--gold);}
.x-thumb.ph svg{width:20px;height:20px;}
.x-bars{display:flex;gap:6px;}
.x-bars i{display:block;width:6px;height:30px;border:1px solid var(--gold);}
.x-bars i.on{background:var(--gold-grad);border-color:transparent;}
.x-bars.mini{gap:4px;}
.x-bars.mini i{width:4px;height:16px;}
.btn.x-danger{border-color:rgba(217,115,98,.55);color:#D97362;}

/* ---------- DAIALY ---------- */
/* body側でセーフエリア分の余白があるため、先頭要素は負のマージンで画面最上部から描画する */
.x-hdr{
  position:sticky;top:0;z-index:15;background:rgba(10,9,8,.96);
  margin-top:calc(-1 * env(safe-area-inset-top));
  padding:calc(env(safe-area-inset-top) + 8px) 16px 10px;border-bottom:1px solid var(--line);
}
.x-hdr-top{display:flex;justify-content:space-between;align-items:center;}
.x-hdr-main{display:flex;justify-content:space-between;align-items:center;margin-top:2px;}
.x-mnav{display:flex;align-items:center;gap:2px;}
.x-arrow{background:none;border:none;color:var(--paper-dim);cursor:pointer;width:36px;height:42px;display:flex;align-items:center;justify-content:center;padding:0;}
.x-arrow svg{width:18px;height:18px;}
.x-month{margin:0 4px;display:flex;align-items:baseline;font-weight:400;}
.x-my{font-family:'Jost',sans-serif;font-size:19px;font-weight:300;color:var(--paper-dim);letter-spacing:.04em;}
.x-mm{
  font-family:'Jost',sans-serif;font-size:34px;font-weight:500;line-height:1;
  background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.x-mj{font-family:'Noto Sans JP',sans-serif;font-size:13px;color:var(--paper-dim);margin:0 3px;}
.x-today{border:1px solid rgba(255,255,255,.45);background:transparent;color:var(--paper);border-radius:999px;padding:8px 16px;font-family:'Jost',sans-serif;font-weight:400;font-size:11px;letter-spacing:.22em;cursor:pointer;}
.x-today:active{background:var(--paper);color:var(--ink);}
.x-content{padding-bottom:calc(env(safe-area-inset-bottom) + 110px);}
.x-cal{padding:0 8px;}
.x-wdrow{display:grid;grid-template-columns:repeat(7,1fr);}
.x-wdrow span{font-size:11px;text-align:center;color:var(--paper-dim);padding:10px 0 8px;}
.x-wdrow .wd0{color:var(--sun);} .x-wdrow .wd6{color:var(--sat);}
.x-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);}
.x-cell{
  min-width:0;min-height:66px;background:transparent;border:none;border-bottom:1px solid var(--line);
  color:var(--paper);display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px 5px;cursor:pointer;border-radius:6px;font:inherit;
}
.x-cell.blank{cursor:default;}
.x-cell.sel{box-shadow:inset 0 0 0 1px var(--gold);}
.x-dnum{font-family:'Jost',sans-serif;font-size:14px;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;flex:none;}
.x-cell.wd0 .x-dnum{color:var(--sun);} .x-cell.wd6 .x-dnum{color:var(--sat);}
.x-cell.hol .x-dnum{color:var(--sun);}
.x-cell.today .x-dnum{background:var(--gold-grad);color:var(--ink);font-weight:500;}
.x-hname{display:block;width:100%;font-size:8px;line-height:1.25;color:var(--sun);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.x-chip{
  display:block;width:100%;font-size:9px;line-height:15px;padding:0 3px;text-align:left;
  border-left:2px solid var(--gold);background:rgba(217,194,122,.16);color:#F0D98F;
  border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.x-more{font-family:'Jost',sans-serif;font-size:9px;color:var(--paper-dim);line-height:1;}
.x-daysec{padding:22px 18px 0;max-width:620px;margin:0 auto;}
.x-daysec-h{font-size:16px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;letter-spacing:.04em;}
.x-tag{font-family:'Jost',sans-serif;font-weight:400;font-size:10px;letter-spacing:.2em;color:var(--ink);background:var(--gold-grad);border-radius:999px;padding:2px 9px;}
.x-htag{font-size:11px;font-weight:500;color:var(--sun);border:1px solid rgba(217,138,126,.5);border-radius:999px;padding:1px 9px;letter-spacing:.04em;}
.x-entry{
  display:flex;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;font:inherit;
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;
  padding:12px;margin-bottom:10px;color:var(--paper);
}
.x-entry:active{background:rgba(255,255,255,.09);}
.x-lrow{display:flex;gap:14px;align-items:flex-start;padding:12px 18px;min-height:58px;border-bottom:1px solid var(--line);cursor:pointer;}
.x-lrow.sel{background:rgba(217,194,122,.09);}
.x-lday{width:32px;flex:none;display:flex;flex-direction:column;align-items:center;padding-top:2px;}
.x-ldnum{font-family:'Jost',sans-serif;font-size:22px;font-weight:400;line-height:1;}
.x-lwd{font-size:10px;color:var(--paper-dim);margin-top:5px;}
.x-lday.wd0 .x-ldnum,.x-lday.wd0 .x-lwd{color:var(--sun);}
.x-lday.wd6 .x-ldnum,.x-lday.wd6 .x-lwd{color:var(--sat);}
.x-lday.hol .x-ldnum,.x-lday.hol .x-lwd{color:var(--sun);}
.x-lday.today .x-ldnum{
  font-weight:600;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.x-lhol{font-size:11px;color:var(--sun);letter-spacing:.06em;line-height:1.4;}
.x-lents{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;padding-top:2px;}
.x-lent{display:flex;gap:10px;align-items:center;width:100%;text-align:left;cursor:pointer;background:none;border:none;color:var(--paper);padding:0;font:inherit;}
.x-lent .x-thumb{width:52px;}
.x-bbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:4px;
  padding:8px 18px calc(env(safe-area-inset-bottom) + 8px);
  background:rgba(10,9,8,.95);border-top:1px solid var(--line);
}
.x-tab{background:none;border:none;color:var(--paper-dim);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:'Jost',sans-serif;font-weight:400;font-size:10px;letter-spacing:.16em;padding:6px 12px;}
.x-tab svg{width:24px;height:24px;}
.x-tab.on{color:var(--gold);}
.x-plus{
  margin-left:auto;width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;
  background:var(--gold-grad);color:var(--ink);display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,.45);
}
.x-plus svg{width:24px;height:24px;}
.x-plus:active{transform:scale(.94);}

/* ---------- 登録画面（DAIALY・ARCHIVE共通） ---------- */
.x-reg{min-height:100vh;}
.x-reg-hdr{
  position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  margin-top:calc(-1 * env(safe-area-inset-top));
  padding:calc(env(safe-area-inset-top) + 12px) 16px 14px;
  background:rgba(10,9,8,.96);border-bottom:1px solid var(--line);
}
.x-reg-cancel{justify-self:start;background:none;border:none;color:var(--paper-dim);font-family:'Noto Sans JP',sans-serif;font-size:14px;padding:6px 0;cursor:pointer;}

<div id="bgimg"></div>
<div id="banner"></div>

<div id="cropper"></div>
<div id="modal"></div>
<div id="x-sheet"></div>
<div id="x-toast" role="status" aria-live="polite"></div>
<div id="x-busy"><span class="eyebrow" id="x-busy-msg" style="text-align:center;line-height:2.2;">データを最適化しています…</span></div>

<script>
"use strict";

/* ============================================================
   SAUNA AWARD ver3.4 — iPhone スタンドアロン版 (SAUNACHELIN風デザイン)
   メニュー: DAIALY / ARCHIVE / AWARD / 設定
   ・AWARD  : Tier1〜3に各7施設（和名はARCHIVEから選択 / ローマ字 / Address / URL / 画像 / ミニ写真）
   ・DAIALY : 行ったサウナをカレンダーで記録（ARCHIVEの施設から選択）
   ・ARCHIVE: 行ったサウナを登録・検索・一覧表示
   ・永続化: IndexedDB "sauna-award"（全機能共通）。画像はすべてJPEGのバイナリで保存（ver3.2〜）
   ・バックアップ: AWARD・DAIALY・ARCHIVE・背景をまとめてzipで保存／復元
   ============================================================ */

const TIERS = [
  { id:1, roman:"I",   jp:"至高" },
  { id:2, roman:"II",  jp:"殿堂" },
  { id:3, roman:"III", jp:"名湯" },
];
const SLOTS = 7;
const MAX_TITLE = 50;   /* 施設名の上限（ARCHIVE・AWARD共通） */
const MAX_DATAURL = 1400000;
const APP_VER = "3.4";

/* ---------------- IndexedDB ---------------- */
const DB_NAME = "sauna-award";
const STORE = "slots";
let dbPromise = null;
let storageOK = true;

function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    try{
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore(STORE); };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error||new Error("db open error"));
    }catch(e){ reject(e); }
  });
  return dbPromise;
}
/* ---- 画像の保存形式（ver3.2〜） ----
   アプリ内では画像を data: URL（文字列）で扱うが、保存時はJPEGのバイナリに変換する。
   base64文字列のまま保存するより約25%小さい。読み込み時に自動で data: URL に戻すため
   旧形式（文字列）で保存されたデータもそのまま読める */
const FMT_KEY = "fmt";       /* 保存形式の目印 */
const FMT_VER = 3;           /* 2 = 画像をバイナリで保存 / 3 = さらに画像サイズを最適化済み（ver3.4〜） */
let fmtOK = false;
function packVal(v){
  if (typeof v==="string" && v.startsWith("data:image/") && v.indexOf(";base64,")>0){
    return { __img:dataURLtoBytes(v).buffer, m:v.slice(5, v.indexOf(";")) };
  }
  if (Array.isArray(v)) return v.map(packVal);
  if (v && typeof v==="object" && !(v instanceof ArrayBuffer)){
    const o = {}; for (const k in v) o[k] = packVal(v[k]); return o;
  }
  return v;
}
function unpackVal(v){
  if (v && typeof v==="object" && v.__img instanceof ArrayBuffer){
    return bytesToDataURL(new Uint8Array(v.__img), v.m || "image/jpeg");
  }
  if (Array.isArray(v)) return v.map(unpackVal);
  if (v && typeof v==="object" && !(v instanceof ArrayBuffer)){
    const o = {}; for (const k in v) o[k] = unpackVal(v[k]); return o;
  }
  return v;
}
function idbRawSet(key,val){
  return openDB().then(db=>new Promise((res,rej)=>{
    const tx = db.transaction(STORE,"readwrite").objectStore(STORE).put(val,key);
    tx.onsuccess = ()=>res(true);
    tx.onerror = ()=>rej(tx.error);
  }));
}
function idbGet(key){
  return openDB().then(db=>new Promise((res,rej)=>{
    const tx = db.transaction(STORE,"readonly").objectStore(STORE).get(key);
    tx.onsuccess = ()=>res(tx.result===undefined?null:unpackVal(tx.result));
    tx.onerror = ()=>rej(tx.error);
  }));
}
async function idbSet(key,val){
  await idbRawSet(key, packVal(val));
  /* 新しい形式で書き込んだDBには目印を付ける */
  if (!fmtOK && key!==FMT_KEY){ fmtOK = true; try{ await idbRawSet(FMT_KEY, FMT_VER); }catch(e){} }
  return true;
}
function idbKeys(){
  return openDB().then(db=>new Promise((res,rej)=>{
    const tx = db.transaction(STORE,"readonly").objectStore(STORE).getAllKeys();
    tx.onsuccess = ()=>res(tx.result || []);
    tx.onerror = ()=>rej(tx.error);
  }));
}
function idbDel(key){
  return openDB().then(db=>new Promise((res,rej)=>{
    const tx = db.transaction(STORE,"readwrite").objectStore(STORE).delete(key);
    tx.onsuccess = ()=>res(true);
    tx.onerror = ()=>rej(tx.error);
  }));
}
const keyFor = (t,s)=>`t${t}s${s}`;

/* 旧バージョン(title/location)のデータを新形式へ変換 */
function normalize(e){
  if (!e) return null;
  return {
    title:   e.title   || "",
    roman:   e.roman   || "",
    address: e.address !== undefined ? e.address : (e.location || ""),
    url:     e.url     || "",
    image:   e.image   || "",
    minis:   Array.isArray(e.minis) ? e.minis.filter(Boolean).slice(0,3) : [],
    sid:     e.sid     || "",   /* 和名を選んだARCHIVEの施設id（ver3.1〜） */
  };
}
function isEmpty(e){ return !e.title && !e.roman && !e.address && !e.url && !e.image && (!e.minis || e.minis.length===0); }

async function loadTier(t){
  const arr = [];
  for (let s=1; s<=SLOTS; s++){
    try{ arr.push(normalize(await idbGet(keyFor(t,s)))); }
    catch(e){ arr.push(null); }
  }
  return arr;
}

if (navigator.storage && navigator.storage.persist){
  navigator.storage.persist().catch(()=>{});
}

/* ---------------- 背景画像 ----------------
   トップ/AWARD/設定画面の背景。IDBのキー "bg" に保存。 */
const BG_KEY = "bg";
let appBg = null;
const bgReady = idbGet(BG_KEY)
  .then((v)=>{ appBg = (typeof v==="string" && v) ? v : null; if (appBg) render(); })
  .catch(()=>{});

/* ---------------- Tier別タイトル背景 ----------------
   Tier画面冒頭のタイトル画面の背景。IDBのキー "bgt1"〜"bgt3" に保存。 */
const tierBgs = { 1:null, 2:null, 3:null };
const tierBgKey = (t)=>`bgt${t}`;
const tierBgReady = Promise.all([1,2,3].map((t)=>
  idbGet(tierBgKey(t))
    .then((v)=>{ if (typeof v==="string" && v) tierBgs[t]=v; })
    .catch(()=>{})
)).then(()=>{ if (view==="tierView") render(); });

/* ---------------- ボタンの配色設定 ----------------
   "default" / "black" / "white" の約10バイトのフラグのみ保存
   （画像等は伴わないため容量への影響は実質ゼロ） */
const BTN_KEY = "btnstyle";
let btnStyle = "default";
function applyBtnStyle(){
  document.body.classList.toggle("btn-black", btnStyle==="black");
  document.body.classList.toggle("btn-white", btnStyle==="white");
}
const btnReady = idbGet(BTN_KEY)
  .then((v)=>{ if (v==="black"||v==="white") btnStyle=v; applyBtnStyle(); })
  .catch(()=>{});

/* ---------------- 容量の解放（DBの作り直し） ----------------
   IndexedDBは削除・上書き後もディスク上に残骸が残り、使用容量が
   減らないことがある。そこで削除系の操作後に、
   「このアプリ専用DB(sauna-award)だけを削除 → 現在の登録内容だけを書き戻す」
   ことで実際の容量を登録内容ぶんまで戻す。
   注意: indexedDB.deleteDatabase("sauna-award") は当アプリが自分で
   作成したデータベースのみを削除するAPIであり、iPhone内の他の
   データ・写真・ファイルには一切アクセスしない。 */
let rebuilding = false;

/* このアプリ専用DB(sauna-award)のみを削除し、完了を確実に待つ */
function deleteOwnDatabase(){
  return new Promise((res)=>{
    let done = false;
    const finish = ()=>{ if(!done){ done=true; res(); } };
    try{
      const req = indexedDB.deleteDatabase(DB_NAME);
      req.onsuccess = finish;
      req.onerror = finish;
      /* 接続が残っていてブロックされた場合も、閉じ次第削除される */
      req.onblocked = ()=>setTimeout(finish, 800);
      setTimeout(finish, 4000); /* 保険 */
    }catch(e){ finish(); }
  });
}

/* アプリが実際に保持しているデータ量（バイト）を直接計算する。
   OSへの問い合わせ(navigator.storage.estimate)は内部ファイルの
   整理が終わるまで減少が反映されないため、表示にはこちらを使う */
/* 保存される実サイズ（画像はバイナリのバイト数、それ以外は文字数）を求める */
function storedSize(v){
  if (v==null) return 0;
  let bin = 0;
  const json = JSON.stringify(v, (k,x)=>{
    if (typeof x==="string" && x.startsWith("data:image/")){ bin += Math.floor((x.length - x.indexOf(",") - 1) * 3 / 4); return ""; }
    if (x instanceof ArrayBuffer){ bin += x.byteLength; return ""; }
    return x;
  });
  return bin + (json ? json.length : 0);
}
async function calcDataSize(){
  await bgReady;
  await tierBgReady;
  let bytes = storedSize(appBg);
  for (const t of [1,2,3]) if (tierBgs[t]) bytes += storedSize(tierBgs[t]);
  for (const T of TIERS){
    const t = T.id;
    const arr = cache[t] || await loadTier(t);
    if (!cache[t]) cache[t] = arr;
    for (const e of arr){
      if (e) bytes += storedSize(e);
    }
  }
  /* DAIALY・ARCHIVE */
  await xReady;
  bytes += xDataSize();
  return bytes;
}

async function rebuildDatabase(){
  if (rebuilding) return;
  rebuilding = true;
  try{
    /* 1) 現在の登録内容（背景画像・Tier別背景・ボタン設定含む）をメモリへ退避 */
    await bgReady;
    await tierBgReady;
    await btnReady;
    await xReady;
    const all = {};
    let hasAny = !!appBg || btnStyle!=="default" || !!tierBgs[1] || !!tierBgs[2] || !!tierBgs[3]
      || aItems.length>0 || dEntries.length>0;
    for (const T of TIERS){
      const t = T.id;
      all[t] = cache[t] || await loadTier(t);
      if (all[t].some(Boolean)) hasAny = true;
    }
    /* 2) 自前のDBだけを削除（接続を閉じてから） */
    try{ const db = await openDB(); db.close(); }catch(e){}
    dbPromise = null;
    await deleteOwnDatabase();
    /* 3) 登録が1件でもあれば書き戻す（空なら空のまま＝ほぼ0MB） */
    if (hasAny){
      for (const T of TIERS){
        const t = T.id;
        for (let i=0;i<SLOTS;i++){
          const e = all[t][i];
          if (e && !isEmpty(e)) await idbSet(keyFor(t,i+1), e);
        }
      }
      if (appBg) await idbSet(BG_KEY, appBg);
      for (const t of [1,2,3]) if (tierBgs[t]) await idbSet(tierBgKey(t), tierBgs[t]);
      if (btnStyle!=="default") await idbSet(BTN_KEY, btnStyle);
      /* DAIALY・ARCHIVE */
      for (const it of aItems) await idbSet(ARC_PREFIX+it.id, it);
      if (dEntries.length) await idbSet(DY_KEY, dPack());
      await idbRawSet(FMT_KEY, FMT_VER);
      fmtOK = true;
    } else {
      fmtOK = false;   /* DBは空（削除済み）。次の保存時に目印を付け直す */
    }
    for (const T of TIERS) cache[T.id] = all[T.id];
  } finally {
    rebuilding = false;
  }
}

/* ---------------- 画像処理 ---------------- */
function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = ()=>rej(new Error("ファイルの読み込みに失敗"));
    r.readAsDataURL(file);
  });
}
function decodeViaImg(src){
  return new Promise((res,rej)=>{
    const img = new Image();
    img.onload = ()=>res(img);
    img.onerror = ()=>rej(new Error("画像のデコードに失敗"));
    img.src = src;
  });
}
async function decodeImage(file,dataUrl){
  try{ return await decodeViaImg(dataUrl); }
  catch(e){
    if (typeof createImageBitmap==="function"){
      try{ return await createImageBitmap(file); }catch(e2){}
    }
    throw new Error("この形式の画像は変換できませんでした");
  }
}
async function compressImage(file){
  const raw = await fileToDataURL(file);
  let src;
  try{ src = await decodeImage(file,raw); }
  catch(e){
    if (raw.length < MAX_DATAURL) return raw;
    throw e;
  }
  const MAX_DIM = 1400;
  const w0 = src.width||src.naturalWidth, h0 = src.height||src.naturalHeight;
  const sc = Math.min(1, MAX_DIM/Math.max(w0,h0));
  const w = Math.max(1,Math.round(w0*sc)), h = Math.max(1,Math.round(h0*sc));
  const c = document.createElement("canvas");
  c.width=w; c.height=h;
  c.getContext("2d").drawImage(src,0,0,w,h);
  for (const q of [0.85,0.72,0.6,0.45,0.32]){
    const out = c.toDataURL("image/jpeg",q);
    if (out.length < MAX_DATAURL) return out;
  }
  const c2 = document.createElement("canvas");
  c2.width=Math.max(1,Math.round(w*0.6)); c2.height=Math.max(1,Math.round(h*0.6));
  c2.getContext("2d").drawImage(src,0,0,c2.width,c2.height);
  return c2.toDataURL("image/jpeg",0.4);
}

/* ---------------- エクスポート / インポート ---------------- */
function dataURLtoBlob(d){
  const i = d.indexOf(",");
  const meta = d.slice(0,i), b64 = d.slice(i+1);
  const m = meta.match(/data:(.*?);base64/);
  const mime = m ? m[1] : "image/jpeg";
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let j=0;j<bin.length;j++) arr[j]=bin.charCodeAt(j);
  return new Blob([arr],{type:mime});
}
function downloadBlob(name,blob){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
}
const csvSafe = (s)=>(s||"").replace(/,/g,"，").replace(/[\r\n]/g," ");
/* CSVの1項目（カンマ・ダブルクォートを含む場合は "" で囲む） */
function csvField(v){
  const t = String(v==null ? "" : v).replace(/[\r\n]+/g, " ");
  return /[",]/.test(t) ? `"${t.replace(/"/g,'""')}"` : t;
}
const csvRow = (arr)=>arr.map(csvField).join(",");
/* CSVの1行を分割（"..." で囲まれた項目に対応。旧形式の行もそのまま読める） */
function csvSplit(line){
  const out = []; let cur = "", q = false;
  for (let i=0;i<line.length;i++){
    const c = line[i];
    if (q){
      if (c==='"'){ if (line[i+1]==='"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c==='"' && cur===""){ q = true; }
    else if (c===","){ out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out;
}

/* ---------------- 一括バックアップ / 復元（zip） ----------------
   zip内容: def_tier{n}.csv（n,和名,ローマ字,Address,URL）
            data_tier{n}_{m}.jpg（メイン画像）
            mini_tier{n}_{m}_{k}.jpg（ミニ写真）
   zipは無圧縮(store)で作成。復元はstore/deflate両対応。 */

const CRC_T = (()=>{ const t=new Uint32Array(256);
  for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c = (c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[i]=c; }
  return t; })();
function crc32(u8){ let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = CRC_T[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0; }

function buildZip(files){
  const enc = new TextEncoder();
  const chunks=[]; const central=[]; let offset=0;
  const u16=(v)=>[v&255,(v>>>8)&255];
  const u32=(v)=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  for (const f of files){
    const name = enc.encode(f.name);
    const crc = crc32(f.data), sz = f.data.length;
    const lh = new Uint8Array([
      ...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(sz),...u32(sz),...u16(name.length),...u16(0)
    ]);
    chunks.push(lh,name,f.data);
    central.push({name,crc,sz,offset});
    offset += lh.length+name.length+sz;
  }
  const cdStart = offset; let cdSize = 0;
  for (const c of central){
    const ch = new Uint8Array([
      ...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(c.crc),...u32(c.sz),...u32(c.sz),
      ...u16(c.name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(c.offset)
    ]);
    chunks.push(ch,c.name); cdSize += ch.length+c.name.length;
  }
  chunks.push(new Uint8Array([
    ...u32(0x06054b50),...u16(0),...u16(0),
    ...u16(central.length),...u16(central.length),
    ...u32(cdSize),...u32(cdStart),...u16(0)
  ]));
  return new Blob(chunks,{type:"application/zip"});
}

async function readZip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  const stop = Math.max(0, buf.byteLength-22-65536);
  for (let i=buf.byteLength-22; i>=stop; i--){
    if (dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  }
  if (eocd<0) throw new Error("zip形式を認識できません");
  const count = dv.getUint16(eocd+10,true);
  let p = dv.getUint32(eocd+16,true);
  const dec = new TextDecoder();
  const out = [];
  for (let n=0;n<count;n++){
    if (dv.getUint32(p,true)!==0x02014b50) break;
    const method = dv.getUint16(p+10,true);
    const csize = dv.getUint32(p+20,true);
    const nameLen = dv.getUint16(p+28,true), extraLen = dv.getUint16(p+30,true), cmtLen = dv.getUint16(p+32,true);
    const lho = dv.getUint32(p+42,true);
    const rawName = dec.decode(u8.subarray(p+46, p+46+nameLen));
    p += 46+nameLen+extraLen+cmtLen;
    if (rawName.endsWith("/")) continue;
    const lnl = dv.getUint16(lho+26,true), lel = dv.getUint16(lho+28,true);
    const start = lho+30+lnl+lel;
    let data = u8.slice(start, start+csize);
    if (method===8){
      const ab = await new Response(
        new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))
      ).arrayBuffer();
      data = new Uint8Array(ab);
    } else if (method!==0){ continue; }
    out.push({ name: rawName.split("/").pop(), path: rawName, data });
  }
  return out;
}

function dataURLtoBytes(d){ return new Uint8Array(atob(d.slice(d.indexOf(",")+1)).split("").map(c=>c.charCodeAt(0))); }
function bytesToDataURL(bytes, mime){
  let bin=""; const CH=0x8000;
  for (let i=0;i<bytes.length;i+=CH) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+CH));
  return `data:${mime};base64,`+btoa(bin);
}
const extMime = (name)=>/\.png$/i.test(name) ? "image/png" : "image/jpeg";

async function buildBackup(){
  await bgReady;
  await tierBgReady;
  const files = [];
  if (appBg) files.push({ name:"bg.jpg", data:dataURLtoBytes(appBg) });
  for (const t of [1,2,3]) if (tierBgs[t] && tierBgs[t].startsWith("data:")) files.push({ name:`bg_tier${t}.jpg`, data:dataURLtoBytes(tierBgs[t]) });
  for (const T of TIERS){
    const t = T.id;
    const arr = cache[t] || await loadTier(t);
    if (!cache[t]) cache[t]=arr;
    let csv = "";
    for (let i=0;i<SLOTS;i++){
      const e = arr[i] || {};
      csv += csvRow([i+1, e.title, e.roman, e.address, e.url]) + "\n";
    }
    files.push({ name:`def_tier${t}.csv`, data:new TextEncoder().encode(csv) });
    for (let i=0;i<SLOTS;i++){
      const e = arr[i];
      if (!e) continue;
      if (e.image) files.push({ name:`data_tier${t}_${i+1}.jpg`, data:dataURLtoBytes(e.image) });
      (e.minis||[]).forEach((m,k)=>{
        if (m) files.push({ name:`mini_tier${t}_${i+1}_${k+1}.jpg`, data:dataURLtoBytes(m) });
      });
    }
  }
  /* AWARDの枠とARCHIVEの施設のつながり: Tier,No,ARCHIVEのid */
  let links = "";
  for (const T of TIERS){
    (cache[T.id]||[]).forEach((e,i)=>{ if (e && e.sid) links += `${T.id},${i+1},${e.sid}\n`; });
  }
  files.push({ name:"award_links.csv", data:new TextEncoder().encode(links) });
  /* DAIALY・ARCHIVE */
  await xReady;
  for (const f of xBackupFiles()) files.push(f);
  const stamp = new Date().toISOString().slice(0,10).replace(/-/g,"");
  downloadBlob(`sauna_award_backup_${stamp}.zip`, buildZip(files));
}

async function restoreFromZip(file){
  const entries = await readZip(await file.arrayBuffer());
  if (!entries.length) throw new Error("zip内にファイルがありません");
  /* 復元は全上書き: まず空のモデルを作り、zipの内容を流し込む */
  const blank = ()=>({title:"",roman:"",address:"",url:"",image:"",minis:[],sid:""});
  const model = {1:[],2:[],3:[]};
  for (const t of [1,2,3]) for (let i=0;i<SLOTS;i++) model[t].push(blank());
  let recognized = 0;
  let newBg = null;
  const newTierBgs = { 1:null, 2:null, 3:null };
  for (const f of entries){
    const csvMatch = f.name.match(/^def_tier([123])\.csv$/i);
    const imgMatch = f.name.match(/^data_tier([123])_([1-7])\.(jpg|jpeg|png)$/i);
    const miniMatch = f.name.match(/^mini_tier([123])_([1-7])_([123])\.(jpg|jpeg|png)$/i);
    const bgMatch = f.name.match(/^bg\.(jpg|jpeg|png)$/i);
    const tbgMatch = f.name.match(/^bg_tier([123])\.(jpg|jpeg|png)$/i);
    if (f.name==="award_links.csv"){
      recognized++;
      for (const line of new TextDecoder().decode(f.data).split(/\r?\n/)){
        const pp = csvSplit(line);
        const tt = Number(pp[0]), nn = Number(pp[1]), sid = (pp[2]||"").trim();
        if (tt>=1 && tt<=3 && nn>=1 && nn<=SLOTS && sid) model[tt][nn-1].sid = sid;
      }
    } else if (bgMatch){
      recognized++;
      newBg = bytesToDataURL(f.data, extMime(f.name));
    } else if (tbgMatch){
      recognized++;
      newTierBgs[Number(tbgMatch[1])] = bytesToDataURL(f.data, extMime(f.name));
    } else if (csvMatch){
      recognized++;
      const t = Number(csvMatch[1]);
      const lines = new TextDecoder().decode(f.data).split(/\r?\n/).filter(l=>l.trim()!=="");
      for (const line of lines){
        const parts = csvSplit(line);
        const n = Number(parts[0]);
        if (!(n>=1 && n<=SLOTS)) continue;
        const e = model[t][n-1];
        if (parts.length <= 3){
          e.title = (parts[1]||"").trim().slice(0,MAX_TITLE);
          e.address = (parts[2]||"").trim();
        } else {
          e.title = (parts[1]||"").trim().slice(0,MAX_TITLE);
          e.roman = (parts[2]||"").trim();
          e.address = (parts[3]||"").trim();
          e.url = parts.slice(4).join(",").trim();
        }
      }
    } else if (imgMatch){
      recognized++;
      model[Number(imgMatch[1])][Number(imgMatch[2])-1].image = bytesToDataURL(f.data, extMime(f.name));
    } else if (miniMatch){
      recognized++;
      model[Number(miniMatch[1])][Number(miniMatch[2])-1].minis[Number(miniMatch[3])-1] = bytesToDataURL(f.data, extMime(f.name));
    }
  }
  /* DAIALY・ARCHIVE（ver3.0以降のバックアップに含まれる） */
  const xr = xParseBackup(entries);
  recognized += xr.count;
  if (!recognized) throw new Error("バックアップ形式のファイルが見つかりません");
  /* 既存の設定はすべて上書き。
     容量が積み上がらないよう、このアプリ専用DBを一旦削除してから
     zipの内容だけを書き込む（他サイト・iPhone本体のデータには触れない） */
  try{ const db = await openDB(); db.close(); }catch(e){}
  dbPromise = null;
  await deleteOwnDatabase();
  await bgReady;
  appBg = newBg;
  if (newBg) await idbSet(BG_KEY, newBg);
  await tierBgReady;
  for (const t of [1,2,3]){
    if (newTierBgs[t]){
      tierBgs[t] = newTierBgs[t];
      await idbSet(tierBgKey(t), newTierBgs[t]);
    } else if (tierBgs[t]==="none"){
      /* 「背景設定なし」はUI設定のため復元後も維持する */
      await idbSet(tierBgKey(t), "none");
    } else {
      tierBgs[t] = null;
    }
  }
  /* ボタン配色はUI設定のため復元後も維持する */
  await btnReady;
  if (btnStyle!=="default") await idbSet(BTN_KEY, btnStyle);
  for (const t of [1,2,3]){
    const arr = [];
    for (let i=0;i<SLOTS;i++){
      const e = model[t][i];
      e.minis = e.minis.filter(Boolean).slice(0,3);
      if (isEmpty(e)){ arr.push(null); }
      else { await idbSet(keyFor(t,i+1), e); arr.push(e); }
    }
    cache[t] = arr;
  }
  /* DAIALY・ARCHIVE: ver3.0以降のバックアップなら上書き。
     それ以前のバックアップ（DAIALY・ARCHIVEを含まない）の場合は現在の内容を残す */
  await xReady;
  if (xr.has){
    aRevokeAll();
    aItems = xr.items;
    dEntries = xr.daialy;
  }
  for (const it of aItems) await idbSet(ARC_PREFIX+it.id, it);
  if (dEntries.length) await idbSet(DY_KEY, dPack());
  try{ await idbRawSet(FMT_KEY, FMT_VER); fmtOK = true; }catch(e){}
}

/* ミニ写真用: 小さめに圧縮 */
async function compressMini(file){
  const raw = await fileToDataURL(file);
  let src;
  try{ src = await decodeImage(file,raw); }
  catch(e){
    if (raw.length < 500000) return raw;
    throw e;
  }
  const MAX_DIM = 600;   /* ミニ写真の表示（高さ150px）に十分な大きさ */
  const w0 = src.width||src.naturalWidth, h0 = src.height||src.naturalHeight;
  const sc = Math.min(1, MAX_DIM/Math.max(w0,h0));
  const w = Math.max(1,Math.round(w0*sc)), h = Math.max(1,Math.round(h0*sc));
  const c = document.createElement("canvas");
  c.width=w; c.height=h;
  c.getContext("2d").drawImage(src,0,0,w,h);
  for (const q of [0.75,0.65,0.5,0.35]){
    const out = c.toDataURL("image/jpeg",q);
    if (out.length < 500000) return out;
  }
  return c.toDataURL("image/jpeg",0.3);
}

  modal.innerHTML = `

/* ---------------- 画像切り抜き（ユーザーが範囲を選択） ----------------
   表示枠(幅:高さ=10:13)に合わせた切り取り枠を表示し、
   ドラッグで位置・スライダーで拡大率を選んでから確定する */
const CROP_AR = 13/10;
const OUT_W = 1000, OUT_H = 1300;
const cropperEl = document.getElementById("cropper");
let crop = null; // {img, slot, fw, fh, s, min, max, tx, ty, drag}

function clampCrop(){
  const iw = crop.img.naturalWidth*crop.s, ih = crop.img.naturalHeight*crop.s;
  crop.tx = Math.min(0, Math.max(crop.fw - iw, crop.tx));
  crop.ty = Math.min(0, Math.max(crop.fh - ih, crop.ty));
}
function applyCrop(){
  clampCrop();
  const im = document.getElementById("crop-img");
  im.style.width = (crop.img.naturalWidth*crop.s)+"px";
  im.style.transform = `translate(${crop.tx}px,${crop.ty}px)`;
}
function openCropper(img, opts){
  const ar = opts.ar || CROP_AR;
  let fw = Math.min(Math.round(window.innerWidth*0.86), 360);
  let fh = Math.round(fw*ar);
  const maxH = Math.round(window.innerHeight*0.6);
  if (fh > maxH){ fh = maxH; fw = Math.max(80, Math.round(fh/ar)); }
  const min = Math.max(fw/img.naturalWidth, fh/img.naturalHeight);
  crop = { img, opts, fw, fh, s:min, min, max:min*4,
           tx:(fw-img.naturalWidth*min)/2, ty:(fh-img.naturalHeight*min)/2, drag:null };
  cropperEl.innerHTML = `
    <p class="crop-note">切り取る範囲を選択してください<br>ドラッグで移動 ／ スライダーで拡大</p>
    <div class="crop-frame" id="crop-frame" style="width:${fw}px;height:${fh}px;">
      <img id="crop-img" alt="">
    </div>
    <input class="crop-zoom" id="crop-zoom" type="range" min="0" max="100" value="0" aria-label="拡大率">
    <div class="crop-actions">
      <button class="tool-btn" id="crop-cancel" style="flex:1;">キャンセル</button>
      <button class="save-btn" id="crop-ok" style="flex:1;letter-spacing:.15em;">この範囲で設定</button>
    </div>`;
  document.getElementById("crop-img").src = img.src;
  cropperEl.classList.add("open");
  applyCrop();
  const frame = document.getElementById("crop-frame");
  frame.addEventListener("pointerdown",(e)=>{
    e.preventDefault();
    frame.setPointerCapture(e.pointerId);
    crop.drag = { x:e.clientX, y:e.clientY, tx:crop.tx, ty:crop.ty };
  });
  frame.addEventListener("pointermove",(e)=>{
    if (!crop || !crop.drag) return;
    crop.tx = crop.drag.tx + (e.clientX - crop.drag.x);
    crop.ty = crop.drag.ty + (e.clientY - crop.drag.y);
    applyCrop();
  });
  const endDrag = ()=>{ if (crop) crop.drag = null; };
  frame.addEventListener("pointerup", endDrag);
  frame.addEventListener("pointercancel", endDrag);
  document.getElementById("crop-zoom").addEventListener("input",(e)=>{
    const t = Number(e.target.value)/100;
    const s2 = crop.min + (crop.max - crop.min)*t;
    /* 枠の中心を基準に拡大縮小 */
    const cx = crop.fw/2, cy = crop.fh/2;
    const px = (cx - crop.tx)/crop.s, py = (cy - crop.ty)/crop.s;
    crop.s = s2;
    crop.tx = cx - px*s2;
    crop.ty = cy - py*s2;
    applyCrop();
  });
  document.getElementById("crop-cancel").addEventListener("click", closeCropper);
  document.getElementById("crop-ok").addEventListener("click", confirmCrop);
}
function closeCropper(){
  cropperEl.classList.remove("open");
  cropperEl.innerHTML = "";
  crop = null;
}
async function confirmCrop(){
  if (!crop) return;
  const { img, opts, s, tx, ty, fw, fh } = crop;
  const sx = -tx/s, sy = -ty/s, sw = fw/s, sh = fh/s;
  const c = document.createElement("canvas");
  c.width = opts.outW; c.height = opts.outH;
  c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, opts.outW, opts.outH);
  const maxLen = opts.maxLen || MAX_DATAURL;
  let out = c.toDataURL("image/jpeg", opts.q || 0.85);
  for (const q of (opts.steps || [0.72, 0.6, 0.45, 0.32])){
    if (out.length < maxLen) break;
    out = c.toDataURL("image/jpeg", q);
  }
  closeCropper();
  await opts.onDone(out);
}

const esc = (s)=>String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2 = (n)=>String(n).padStart(2,"0");
function safeHref(u){
  const s = String(u||"").trim();
  if (/^https?:\/\//i.test(s)) return s;
  if (s && !/^[a-z]+:/i.test(s)) return "https://" + s;
  return "";
}

function marquee(text, lined){
  const seg = ` ${text} − `;
  const line = esc(seg.repeat(6));
  return `<div class="marquee ${lined?"lined":""}" aria-hidden="true"><div class="marquee-track"><span>${line}</span><span>${line}</span></div></div>`;
}

}

function entryHTML(e, i, t){

  /* ローマ字名: 「¥」（および￥・バックスラッシュ）を改行として扱う */
  const tickerName = (e.roman || e.title || "").replace(/[¥￥\\]/g, " ");
  const tseg = esc(` Sauna Award − ${i+1} −${tickerName.trim()?` ${tickerName} −`:""} `.repeat(4));
  const ticker = `<div class="hero-ticker"><div class="marquee-track"><span>${tseg}</span><span>${tseg}</span></div></div>`;
  const hero = `
    <div class="hero" ${e.image?`style="background-image:url('${e.image}');"`:""}>
      ${ticker}
      ${numBlock}
      <div class="hero-inner">
        ${e.roman?`<h3 class="romaji">${esc(e.roman).replace(/[¥￥\\]/g,"<br>")}</h3>`:""}
        ${e.title?`<p class="waname">${esc(e.title)}</p>`:""}
        ${href?`<a class="detail-link" href="${esc(href)}" target="_blank" rel="noopener">⇗ 施設詳細へ</a>`:""}
      </div>
    </div>`;
  const meta = `
    <div class="meta">
      ${e.address?`<p class="mlabel">Address</p><p class="mval">${esc(e.address)}</p>`:""}
      ${href?`<p class="mlabel">URL</p><a class="mval" href="${esc(href)}" target="_blank" rel="noopener">${esc(e.url)}</a>`:""}
    </div>`;
  /* ミニ写真: 登録枚数が少なくても同じ画像を繰り返してループさせる */
  let miniStrip = "";
  const minis = (e.minis||[]).filter(Boolean);

    miniStrip = `<div class="mini-strip" aria-hidden="true"><div class="mini-track">${group}${group}</div></div>`;
  }
  return `
  <article style="padding:34px 0 30px;border-bottom:1px solid var(--line);">
    ${hero}
    ${meta}
    ${miniStrip}
  </article>`;
}

function readSlotInputs(slot){
  const g = (cls)=>{ const el = root.querySelector(`.${cls}[data-slot="${slot}"]`); return el?el.value:""; };
  const prev = (cache[activeTier]||[])[slot];
  return {
    title:   (prev&&prev.title)||"",   /* 和名はARCHIVEから選択（入力欄なし） */
    sid:     (prev&&prev.sid)||"",
    roman:   g("js-roman").trim(),
    address: g("js-address").trim(),
    url:     g("js-url").trim(),
    image:   (prev&&prev.image)||"",
    minis:   (prev&&prev.minis)?prev.minis.slice():[],
  };
}
function setStatus(slot, msg, isError){
  const el = root.querySelector(`.js-status[data-slot="${slot}"]`);
  if (!el) return;
  el.textContent = msg;
  el.style.color = isError ? "#D97362" : "var(--gold)";
  if (msg==="SAVED ✓") setTimeout(()=>{ if(el.textContent==="SAVED ✓") el.textContent=""; },2000);
}
async function persistSlot(slot, next, compact){
  const key = keyFor(activeTier, slot+1);
  const arr = cache[activeTier] || Array(SLOTS).fill(null);
  try{
    if (isEmpty(next)){
      await idbDel(key); arr[slot]=null;
    } else {
      await idbSet(key, next); arr[slot]=next;
    }
    cache[activeTier]=arr;
    /* 画像の削除・差し替えを伴う操作では残骸を掃除して容量を戻す */
    if (compact) await rebuildDatabase();
    setStatus(slot,"SAVED ✓");
    return true;
  }catch(e){
    arr[slot] = isEmpty(next)?null:next;
    cache[activeTier]=arr;
    storageOK = false; showBanner();
    setStatus(slot,"保存に失敗しました（画面には反映済み）",true);
    return false;
  }
}

function showBanner(){
  document.getElementById("banner").innerHTML = storageOK ? "" :
    `<div class="banner">この環境では永続保存に失敗しています。エクスポートでのバックアップをおすすめします</div>`;
}

/* すべてのティッカーの速度を一定にする（トップ画面・写真上ティッカー共通） */
const TICKER_SPEED = 35; /* 文字: px/秒 */
const MINI_SPEED = 28;   /* ミニ写真: px/秒（ver1.9と2.0の中間の速さ） */
function tuneMarquees(){
  document.querySelectorAll(".marquee-track").forEach((tr)=>{
    const half = tr.scrollWidth / 2;
    if (half > 0) tr.style.animationDuration = Math.max(10, half / TICKER_SPEED) + "s";
  });
  document.querySelectorAll(".mini-track").forEach((tr)=>{
    const half = tr.scrollWidth / 2;
    if (half > 0) tr.style.animationDuration = Math.max(15, half / MINI_SPEED) + "s";
  });
}

/* Safariはバックグラウンド復帰時等にCSSアニメーションを停止させたままに
   することがある。アニメーションを一旦外して強制リフローし、再始動させる */
function restartMarquees(){
  document.querySelectorAll(".marquee-track, .mini-track").forEach((tr)=>{
    tr.style.animation = "none";
    void tr.offsetWidth; /* リフローを強制してリセットを確定 */
    tr.style.animation = "";
    delete tr.dataset.lastT;
  });
  tuneMarquees();
}
document.addEventListener("visibilitychange", ()=>{
  if (document.visibilityState === "visible") restartMarquees();
});
window.addEventListener("pageshow", ()=>restartMarquees());

/* 見張り処理: 復帰イベントが発火しないケースやメモリ圧迫で
   アニメーションが凍結した場合に備え、2秒ごとにミニ写真の
   実際の位置(transform)を監視し、動いていなければ個別に再始動する。
   これにより「どんな時でも流れる」ことを保証する */
setInterval(()=>{
  if (document.visibilityState !== "visible") return;
  document.querySelectorAll(".mini-track").forEach((tr)=>{
    /* 画像の読み込みで幅が変わったら速度を再調整 */
    const w = String(tr.scrollWidth);
    if (tr.dataset.lastW !== w){
      tr.dataset.lastW = w;
      tuneMarquees();
    }
    let cur = "";
    try{ cur = getComputedStyle(tr).transform || ""; }catch(e){ return; }
    if (tr.dataset.lastT !== undefined && tr.dataset.lastT === cur){
      /* 2秒間まったく動いていない → 再始動 */
      tr.style.animation = "none";
      void tr.offsetWidth;
      tr.style.animation = "";
      tuneMarquees();
      delete tr.dataset.lastT;
      return;
    }
    tr.dataset.lastT = cur;
  });
}, 2000);

const holCache = {};
function holidaysOf(y){
  if (holCache[y]) return holCache[y];
  const h = {};
  const add = (m,d,name)=>{ h[`${y}-${pad2(m)}-${pad2(d)}`] = name; };
  const nthMon = (m,n)=>{ const first = new Date(y,m-1,1).getDay(); return 1 + ((8-first)%7) + (n-1)*7; };
  const e = y - 1980;
  add(1,1,"元日");
  add(1,nthMon(1,2),"成人の日");
  add(2,11,"建国記念の日");
  if (y>=2020) add(2,23,"天皇誕生日");
  add(3,Math.floor(20.8431 + 0.242194*e - Math.floor(e/4)),"春分の日");
  add(4,29,"昭和の日");
  add(5,3,"憲法記念日"); add(5,4,"みどりの日"); add(5,5,"こどもの日");
  if (y===2020){ add(7,23,"海の日"); add(7,24,"スポーツの日"); add(8,10,"山の日"); }
  else if (y===2021){ add(7,22,"海の日"); add(7,23,"スポーツの日"); add(8,8,"山の日"); }
  else {
    add(7,nthMon(7,3),"海の日");
    if (y>=2016) add(8,11,"山の日");
    add(10,nthMon(10,2), y>=2020 ? "スポーツの日" : "体育の日");
  }
  add(9,nthMon(9,3),"敬老の日");
  add(9,Math.floor(23.2488 + 0.242194*e - Math.floor(e/4)),"秋分の日");
  add(11,3,"文化の日");
  add(11,23,"勤労感謝の日");
  if (y<=2018) add(12,23,"天皇誕生日");
  if (y===2019){ add(5,1,"天皇の即位の日"); add(10,22,"即位礼正殿の儀"); }
  for (const k of Object.keys(h).sort()){
    const d = parseYmd(k);
    const n1 = new Date(d.getFullYear(), d.getMonth(), d.getDate()+1);
    const n2 = new Date(d.getFullYear(), d.getMonth(), d.getDate()+2);
    if (!h[ymd(n1)] && h[ymd(n2)] && n1.getDay()!==0) h[ymd(n1)] = "国民の休日";
  }
  for (const k of Object.keys(h).sort()){
    const d = parseYmd(k);
    if (d.getDay()!==0) continue;
    const n = new Date(d.getFullYear(), d.getMonth(), d.getDate()+1);
    while (h[ymd(n)]) n.setDate(n.getDate()+1);
    if (n.getFullYear()===y) h[ymd(n)] = "振替休日";
  }
  return (holCache[y] = h);
}

function idbGetPrefix(prefix){
  return openDB().then((db)=>new Promise((res,rej)=>{
    const q = db.transaction(STORE,"readonly").objectStore(STORE).getAll(IDBKeyRange.bound(prefix, prefix+"\uffff"));
    q.onsuccess = ()=>res(q.result || []);
    q.onerror = ()=>rej(q.error);
  }));
}
/* DAIALYは必要最小限の項目だけを保存 */
function dPack(){
  return dEntries.map((e)=>e.sid ? { id:e.id, date:e.date, sid:e.sid } : { id:e.id, date:e.date, name:e.name||"", loc:e.loc||"" });
}
async function dSave(){
  try{
    if (dEntries.length) await idbSet(DY_KEY, dPack());

    return true;

/* 画像の表示用URL（バイナリから作成し、使い回す） */
const aUrls = new Map();
/* 画像の表示用URL。保存はバイナリのまま、表示時にURLへ変換してidごとに使い回す。
   ・blob: URLが使える環境（GitHub Pagesなど）: 軽量なblob: URL（画面のHTMLが小さく、表示が速い）
   ・使えない環境（プレビュー画面など）: data: URL */
let xUseBlob = false;
(function(){
  try{
    const png = Uint8Array.from(atob("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="), (c)=>c.charCodeAt(0));
    const u = URL.createObjectURL(new Blob([png], { type:"image/png" }));
    const im = new Image();
    im.onload = ()=>{ URL.revokeObjectURL(u); xUseBlob = true; aRevokeAll(); if (xIsView(view)) xRerenderKeep(); };
    im.onerror = ()=>{ URL.revokeObjectURL(u); };
    im.src = u;
  }catch(e){}
})();
function aImgURL(it){
  if (!it || !it.img) return "";
  const c = aUrls.get(it.id);
  if (c && c.buf===it.img && c.blob===xUseBlob) return c.url;
  if (c && c.blob) URL.revokeObjectURL(c.url);
  const url = xUseBlob ? URL.createObjectURL(new Blob([it.img], { type:"image/jpeg" }))
                       : bytesToDataURL(new Uint8Array(it.img), "image/jpeg");
  aUrls.set(it.id, { buf:it.img, url, blob:xUseBlob });
  return url;
}
function aRevoke(id){ const c = aUrls.get(id); if (c && c.blob) URL.revokeObjectURL(c.url); aUrls.delete(id); }
function aRevokeAll(){ for (const id of Array.from(aUrls.keys())) aRevoke(id); }

/* 登録データ容量（DAIALY・ARCHIVE分） */
function xDataSize(){
  let bytes = 0;
  for (const it of aItems) bytes += storedSize(it);
  if (dEntries.length) bytes += storedSize(dPack());

}

/* バックアップ用ファイル
   archive.csv : id,施設名,都道府県,星(1/0),登録日時
   archive_<id>.jpg : 画像
   daialy.csv  : id,日付,ARCHIVEのid,施設名,地域（施設名・地域はARCHIVE未登録の記録のみ） */
function xBackupFiles(){
  const enc = new TextEncoder();
  const files = [];
  let acsv = "";
  for (const it of aItems){
    acsv += csvRow([it.id, it.name, it.pref||"", it.star?1:0, it.at||0]) + "\n";
    if (it.img) files.push({ name:`archive_${it.id}.jpg`, data:new Uint8Array(it.img) });
  }
  let dcsv = "";
  for (const e of dEntries){
    dcsv += (e.sid ? csvRow([e.id, e.date, e.sid, "", ""]) : csvRow([e.id, e.date, "", e.name, e.loc])) + "\n";
  }
  files.unshift({ name:"archive.csv", data:enc.encode(acsv) });
  files.push({ name:"daialy.csv", data:enc.encode(dcsv) });
  return files;
}
function xParseBackup(entries){
  const out = { has:false, items:[], daialy:[], count:0 };
  const imgs = {};
  const dec = new TextDecoder();
  for (const f of entries){
    if (f.name==="archive.csv"){
      out.has = true; out.count++;
      for (const line of dec.decode(f.data).split(/\r?\n/)){
        const p = csvSplit(line);
        if (!p[0] || !p[1] || !p[1].trim()) continue;
        const pref = (p[2]||"").trim();
        out.items.push({ id:p[0].trim(), name:p[1].trim().slice(0,MAX_TITLE), pref:PREF_ORDER.includes(pref) ? pref : "",
                         star:Number(p[3])>0 ? 1 : 0, img:null, at:Number(p[4])||Date.now() });
      }
    } else if (f.name==="daialy.csv"){
      out.count++;
      for (const line of dec.decode(f.data).split(/\r?\n/)){
        const p = csvSplit(line);
        if (!p[0] || !/^\d{4}-\d{2}-\d{2}$/.test((p[1]||"").trim())) continue;
        const sid = (p[2]||"").trim();
        out.daialy.push(sid ? { id:p[0].trim(), date:p[1].trim(), sid }
                            : { id:p[0].trim(), date:p[1].trim(), name:(p[3]||"").trim(), loc:(p[4]||"").trim() });
      }
    } else {
      const m = f.name.match(/^archive_([a-z0-9]+)\.(jpe?g|png)$/i);
      if (m){ out.count++; imgs[m[1]] = f.data.slice().buffer; }
    }
  }
  for (const it of out.items) it.img = imgs[it.id] || null;
  out.items.sort((a,b)=>a.at-b.at);
  const ids = new Set(out.items.map((x)=>x.id));
  out.daialy = out.daialy.filter((e)=>!e.sid || ids.has(e.sid) || e.name);
  return out;
}

/* プロトタイプ（daialy.html / list.html / daialy-list.html）のデータを一度だけ引き継ぐ。
   正式版にDAIALY・ARCHIVEのデータがまだ無い場合のみ実行し、
   引き継ぎ後はプロトタイプ側の保存領域を削除して容量の二重化を防ぐ */
async function migrateFromPrototype(){
  const P_DB = "sauna-award-list-proto", P_KEY = "sauna-award:daialy-proto:v1";
  let hasDB = false, pItems = [], pDaialy = [];
  try{
    if (indexedDB.databases){
      const dbs = await indexedDB.databases();
      hasDB = dbs.some((d)=>d.name===P_DB);
    }
  }catch(e){}
  if (hasDB){
    pItems = await new Promise((res)=>{
      try{
        const r = indexedDB.open(P_DB);
        r.onupgradeneeded = ()=>{ try{ r.transaction.abort(); }catch(e){} };
        r.onerror = ()=>res([]);
        r.onsuccess = ()=>{
          const db = r.result;
          try{
            const q = db.transaction("items","readonly").objectStore("items").getAll();
            q.onsuccess = ()=>{ db.close(); res(q.result || []); };
            q.onerror = ()=>{ db.close(); res([]); };
          }catch(e){ db.close(); res([]); }
        };
      }catch(e){ res([]); }
    });
  }
  try{ const raw = localStorage.getItem(P_KEY); if (raw){ const a = JSON.parse(raw); if (Array.isArray(a)) pDaialy = a; } }catch(e){}
  if (!pItems.length && !pDaialy.length){
    if (hasDB){ try{ indexedDB.deleteDatabase(P_DB); }catch(e){} }
    return false;
  }
  const items = pItems.filter((it)=>it && it.id && it.name).map((it)=>({
    id:it.id, name:String(it.name).slice(0,MAX_TITLE), pref:PREF_ORDER.includes(it.pref) ? it.pref : "",
    star:it.stars>0 ? 1 : 0,
    img:(typeof it.image==="string" && it.image.startsWith("data:")) ? dataURLtoBytes(it.image).buffer : null,
    at:it.createdAt || Date.now(),
  })).sort((a,b)=>a.at-b.at);
  const ids = new Set(items.map((x)=>x.id));
  const entries = pDaialy.filter((e)=>e && e.id && e.date).map((e)=>(e.saunaId && ids.has(e.saunaId))
    ? { id:e.id, date:e.date, sid:e.saunaId }
    : { id:e.id, date:e.date, name:e.name||"", loc:e.location||"" });
  /* 正式版にすでにあるもの（同じid）は取り込まない */
  const haveA = new Set(aItems.map((x)=>x.id)), haveD = new Set(dEntries.map((x)=>x.id));
  const addA = items.filter((x)=>!haveA.has(x.id)), addD = entries.filter((x)=>!haveD.has(x.id));
  try{
    for (const it of addA) await idbSet(ARC_PREFIX+it.id, it);
    aItems = aItems.concat(addA).sort((a,b)=>a.at-b.at);
    dEntries = dEntries.concat(addD);
    if (!(await dSave())) throw new Error("save");
  }catch(e){ return false; }
  try{ if (hasDB) indexedDB.deleteDatabase(P_DB); }catch(e){}
  try{ localStorage.removeItem(P_KEY); }catch(e){}
  return addA.length>0 || addD.length>0;
}

const xReady = (async ()=>{

    const d = await idbGet(DY_KEY);

})();

/* 並び替え後の一覧（番号はこの順番で振る）
   ・登録順: 登録した順
   ・地域  : REGION_ORDER の順。同じ都道府県内は登録順
   ・お気に入り: TIER I → TIER II → TIER III（各TierはAWARDの1〜7の順）→ 星あり → その他
                 星あり・その他は地域順 */
function aSorted(){
  const list = aItems.slice().sort((a,b)=>a.at-b.at);
  if (aSort==="area") return list.sort((a,b)=>prefRank(a.pref)-prefRank(b.pref));
  if (aSort==="fav"){
    const pos = {};
    for (const T of TIERS){
      (cache[T.id]||[]).forEach((e,i)=>{ const sid = awardSidOf(e); if (sid && pos[sid]===undefined) pos[sid] = T.id*10 + i; });
    }
    const key = (it)=>pos[it.id]!==undefined ? [0, pos[it.id]] : [it.star>0 ? 1 : 2, prefRank(it.pref)];
    return list.sort((a,b)=>{ const ka = key(a), kb = key(b); return ka[0]-kb[0] || ka[1]-kb[1]; });
  }
  return list;
}

function xRender(){
  if (view==="archive" || view==="adetail") ensureAward();
  const key = view + (view==="daialy" ? ":"+xs.mode : "");
  const anim = key!==xLastKey ? "x-fade" : "";
  xLastKey = key;
  if (!xLoaded){
    return `<div class="x-fade" style="min-height:80vh;display:flex;align-items:center;justify-content:center;"><span class="eyebrow">Loading…</span></div>`;
  }
  if (view==="daialy"){
    /* 固定バーはアニメーション要素の外に置く。月切り替え時はスライド */
    const cls = xs.slide ? (xs.slide==="next" ? "x-slide-next" : "x-slide-prev") : anim;
    xs.slide = null;
    return `${dHeaderHTML()}<main class="x-content ${cls}">${xs.mode==="cal"?dCalHTML():dListHTML()}</main>${dBarHTML()}`;
  }
  let html = "";
  if (view==="dreg") html = dRegHTML();
  else if (view==="archive") html = aPageHTML();
  else if (view==="adetail") html = aDetailHTML();
  else if (view==="areg") html = aRegHTML();
  return `<div class="${anim}">${html}</div>`
    + (view==="archive" ? `<button class="x-fab" data-x="a-add" aria-label="サウナを登録">${XI.plus}</button>` : "");
}
function xRerenderKeep(){ const y = window.scrollY; render(); window.scrollTo(0,y); }
function xShow(v, y){ view = v; render(); window.scrollTo(0, y||0); }

function dSetMonth(y, m){
  const d = new Date(y, m, 1);
  xs.y = d.getFullYear(); xs.m = d.getMonth();
  const t = new Date();
  xs.sel = (t.getFullYear()===xs.y && t.getMonth()===xs.m) ? ymd(t) : ymd(d);
}
/* 月を切り替える（矢印・スワイプ共通） */
function dChangeMonth(delta){
  dSetMonth(xs.y, xs.m + delta);
  xs.slide = delta > 0 ? "next" : "prev";
  render();
  window.scrollTo(0,0);
}
function dScrollToSel(smooth){
  const el = document.getElementById("x-row-"+xs.sel);
  const hdr = document.querySelector(".x-hdr");
  if (!el) return;
  const top = el.getBoundingClientRect().top + window.scrollY - (hdr ? hdr.offsetHeight : 0) - 6;
  window.scrollTo({ top:Math.max(0,top), behavior: smooth ? "smooth" : "auto" });
}
function dCaptureDate(){
  const el = document.getElementById("x-date");
  if (el && /^\d{4}-\d{2}-\d{2}$/.test(el.value) && xs.dDraft) xs.dDraft.date = el.value;
}
function dOpenReg(entry){
  xs.dY = window.scrollY;
  if (entry){
    const s = aOf(entry.sid);
    xs.dEditId = entry.id;
    xs.dDraft = s ? { date:entry.date, sid:s.id, name:"", loc:"" }
                  : { date:entry.date, sid:null, name:entry.name||"", loc:entry.loc||"" };
  } else {
    xs.dEditId = null;
    xs.dDraft = { date:xs.sel, sid:null, name:"", loc:"" };

  xShow("dreg");
}

/* ARCHIVEにないサウナ → ARCHIVEの登録画面へ（戻り先はDAIALY登録画面） */
function dGoNewSauna(prefill){
  dCaptureDate();
  xs.aOrigin = "dreg";
  xs.aEditId = null;
  aNewDraft({ name:(prefill||"").slice(0,MAX_TITLE) });

async function dSubmit(){
  dCaptureDate();
  const dd = xs.dDraft;
  const s = aOf(dd.sid);
  if (!s && !dd.name){ xToast("ARCHIVEからサウナを選択してください"); return; }
  const rec = s ? { sid:s.id } : { name:dd.name, loc:dd.loc||"" };
  const wasEdit = !!xs.dEditId;
  if (wasEdit){
    const i = dEntries.findIndex((x)=>x.id===xs.dEditId);
    if (i>=0) dEntries[i] = Object.assign({ id:dEntries[i].id, date:dd.date }, rec);
  } else {
    dEntries.push(Object.assign({ id:xNewId(), date:dd.date }, rec));
  }
  const ok = await dSave();
  const prevMonth = xs.y + "-" + xs.m;
  const d = parseYmd(dd.date);
  xs.y = d.getFullYear(); xs.m = d.getMonth(); xs.sel = dd.date;
  xs.dEditId = null; xs.dDraft = null;
  view = "daialy"; render();
  if (xs.mode==="list") dScrollToSel(false);
  else window.scrollTo(0, prevMonth===(xs.y+"-"+xs.m) ? xs.dY : 0);
  xToast(ok ? (wasEdit ? "記録を更新しました" : "記録を登録しました") : "保存できませんでした");

async function dRemove(){
  const e = dEntries.find((x)=>x.id===xs.dEditId);
  if (!e) return;
  const yes = await showConfirm(`「${esc(dInfo(e).name)}」の記録を削除しますか？`, "削除する", "戻る");
  if (!yes) return;
  dEntries = dEntries.filter((x)=>x.id!==e.id);
  await dSave();

function aScrollToListTop(smooth){

  if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY, behavior: smooth ? "smooth" : "auto" });

function aApplySearch(){
