  if (inp){ aSearch.q = inp.value; inp.blur(); }
  const q = aSearch.q.trim();
  aApplied = (q || aSearch.prefs.length || aSearch.star.length)
    ? { q, prefs:aSearch.prefs.slice(), star:aSearch.star.slice() } : null;
  render();
  aScrollToListTop(false);
}
function aResetSearch(){ aSearch = { q:"", prefs:[], star:[] }; aApplied = null; }
/* 登録画面の下書き。画像はプレビュー用URLを都度作成し、閉じるときに解放する */
function aNewDraft(base){
  aDropDraft();
  aDraft = { name:"", pref:"", star:0, img:null, preview:"" };
  Object.assign(aDraft, base || {});
  if (aDraft.img) aDraft.preview = bytesToDataURL(new Uint8Array(aDraft.img), "image/jpeg");
}
function aSetDraftImg(buf, url){
  aDraft.img = buf || null;
  aDraft.preview = buf ? (url || bytesToDataURL(new Uint8Array(buf), "image/jpeg")) : "";
}
function aDropDraft(){ aDraft = null; }
function aCancel(){
  xs.aEditId = null;
  aDropDraft();
  if (xs.aOrigin==="dreg") xShow("dreg");
  else if (xs.aOrigin==="award"){ activeTier = xs.awTier; xShow("settingsTier", xs.awY); }
  else if (xs.aOrigin==="detail") xShow("adetail");
  else xShow("archive", xs.aY);
}
async function aSubmit(){
  if (xBusy) return;
  const name = aDraft.name.trim().slice(0,MAX_TITLE);
  if (!name){ xToast("サウナ施設名を入力してください"); return; }
  xBusy = true;
  const editing = xs.aEditId;
  let it, imgChanged = false, ok = true;
  if (editing){
    it = aOf(editing);
    if (!it){ xBusy = false; return; }
    imgChanged = it.img !== aDraft.img;
    await ensureAward();
    const awLinked = awardLinkedSlots(it.id);   /* 名前を変える前に、つながっているAWARDの枠を控える */
    Object.assign(it, { name, pref:aDraft.pref, star:aDraft.star ? 1 : 0, img:aDraft.img || null });
    for (const { t, i, e } of awLinked){
      e.title = name.slice(0,MAX_TITLE); e.sid = it.id;
      try{ await idbSet(keyFor(t,i+1), e); }catch(err){}
    }
    if (imgChanged) aRevoke(it.id);
  } else {
    it = { id:xNewId(), name, pref:aDraft.pref, star:aDraft.star ? 1 : 0, img:aDraft.img || null, at:Date.now() };
    aItems.push(it);
  }
  try{
    await idbSet(ARC_PREFIX+it.id, it);
    if (editing && imgChanged) await rebuildDatabase();   /* 古い画像の残骸を消して容量を戻す */
  }catch(e){ ok = false; storageOK = false; showBanner(); }
  xBusy = false;
  aDropDraft();
  xs.aEditId = null;
  const fail = "保存できませんでした";
  if (editing){
    xs.detailId = it.id; xShow("adetail");
    xToast(ok ? "保存しました" : fail);
  } else if (xs.aOrigin==="award"){
    /* AWARDの設定画面に戻り、登録したサウナを和名に設定する */
    activeTier = xs.awTier; view = "settingsTier"; render();
    await awardPick(xs.awSlot, it.id);
    window.scrollTo(0, xs.awY);
    xToast(ok ? "ARCHIVEに登録し、このサウナを選択しました" : fail);
  } else if (xs.aOrigin==="dreg"){
    /* DAIALY登録画面に戻り、登録したサウナを選択済みにする */
    xs.dDraft.sid = it.id; xs.dDraft.name = ""; xs.dDraft.loc = "";
    xShow("dreg");
    xToast(ok ? "ARCHIVEに登録し、このサウナを選択しました" : fail);
  } else {
    aResetSearch();
    view = "archive"; render();
    const el = document.getElementById("x-card-"+it.id);
    if (el) el.scrollIntoView({ block:"center" });
    xToast(ok ? "登録しました" : fail);
  }
}
async function aRemove(){
  const it = aOf(xs.detailId);
  if (!it) return;
  const linked = dEntries.filter((e)=>e.sid===it.id).length;
  await ensureAward();
  const awLinked = awardLinkedSlots(it.id);
  const notes = [];
  if (awLinked.length) notes.push(`AWARD（${awardTiersOf(it.id).map((T)=>"TIER "+T.roman).join("、")}）に設定されています。AWARD側は施設名だけ残ります`);
  if (linked) notes.push(`DAIALYの記録${linked}件は、施設名だけ残ります`);
  const note = notes.length ? `<br><span style="font-size:12px;color:var(--paper-dim);">${notes.join("<br>")}</span>` : "";
  const yes = await showConfirm(`「${esc(it.name)}」を削除しますか？${note}`, "削除する", "戻る");
  if (!yes) return;
  if (linked){
    dEntries = dEntries.map((e)=>e.sid===it.id ? { id:e.id, date:e.date, name:it.name, loc:shortPref(it.pref) } : e);
    await dSave();
  }
  for (const { t, i, e } of awLinked){
    e.title = e.title || it.name; e.sid = "";
    try{ await idbSet(keyFor(t,i+1), e); }catch(err){}
  }
  aItems = aItems.filter((x)=>x.id!==it.id);
  aRevoke(it.id);
  try{ await idbDel(ARC_PREFIX+it.id); await rebuildDatabase(); }catch(e){}
  xShow("archive", xs.aY);
  xToast("削除しました");
}
/* ================================================================
   保存形式の移行（ver3.2）: 旧形式のデータを一度だけ作り直して容量を削減
   ================================================================ */
function xBusy_(on, msg){
  const b = document.getElementById("x-busy");
  const m = document.getElementById("x-busy-msg");
  if (m) m.innerHTML = msg || "データを最適化しています…";
  if (b) b.classList.toggle("on", !!on);
}
/* JPEGの縦横サイズをヘッダーから読む（画像を展開せずに判定できる） */
function jpegDims(u8){
  if (!u8 || u8[0]!==0xFF || u8[1]!==0xD8) return null;
  let i = 2;
  while (i+9 < u8.length){
    if (u8[i]!==0xFF){ i++; continue; }
    const m = u8[i+1];
    if (m>=0xC0 && m<=0xCF && m!==0xC4 && m!==0xC8 && m!==0xCC) return { h:(u8[i+5]<<8)|u8[i+6], w:(u8[i+7]<<8)|u8[i+8] };
    if (m===0xD8 || m===0x01 || (m>=0xD0 && m<=0xD7)){ i += 2; continue; }
    i += 2 + ((u8[i+2]<<8)|u8[i+3]);
  }
  return null;
}
function b64ToBytes(dataUrl){
  const bin = atob(dataUrl.slice(dataUrl.indexOf(",")+1));
  const u = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return u;
}
/* 表示に必要な大きさを超える画像だけ縮小。小さくならなければ元のまま（null） */
async function xShrinkJpeg(u8, maxW, maxH, q){
  const d = jpegDims(u8);
  if (!d || (d.w <= maxW && d.h <= maxH)) return null;
  const sc = Math.min(maxW/d.w, maxH/d.h);
  const w = Math.max(1, Math.round(d.w*sc)), h = Math.max(1, Math.round(d.h*sc));
  let src = null;
  try{ if (typeof createImageBitmap==="function") src = await createImageBitmap(new Blob([u8], { type:"image/jpeg" })); }catch(e){}
  if (!src) src = await decodeViaImg(bytesToDataURL(u8, "image/jpeg"));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(src, 0, 0, w, h);
  if (src.close) src.close();
  const out = b64ToBytes(c.toDataURL("image/jpeg", q));
  c.width = c.height = 0;
  return out.length < u8.length ? out : null;
}
async function xOptimizeImages(){
  const jobs = [];
  for (const it of aItems) if (it.img) jobs.push({ k:"arc", it });
  if (appBg) jobs.push({ k:"bg" });
  for (const t of [1,2,3]) if (tierBgs[t] && tierBgs[t]!=="none") jobs.push({ k:"tbg", t });
  for (const T of TIERS){
    const arr = cache[T.id] || await loadTier(T.id);
    cache[T.id] = arr;
    arr.forEach((e,i)=>{ if (e && e.minis) e.minis.forEach((m,j)=>{ if (m) jobs.push({ k:"mini", e, j }); }); });
  }
  for (let n=0; n<jobs.length; n++){
    const jb = jobs[n];
    xBusy_(true, `データを最適化しています<br>${n+1} / ${jobs.length}`);
    try{
      if (jb.k==="arc"){
        const r = await xShrinkJpeg(new Uint8Array(jb.it.img), 960, 640, 0.8);
        if (r){ jb.it.img = r.buffer; aRevoke(jb.it.id); }
      } else if (jb.k==="bg"){
        const r = await xShrinkJpeg(b64ToBytes(appBg), 720, 1600, 0.7);
        if (r) appBg = bytesToDataURL(r, "image/jpeg");
      } else if (jb.k==="tbg"){
        const r = await xShrinkJpeg(b64ToBytes(tierBgs[jb.t]), 720, 1600, 0.7);
        if (r) tierBgs[jb.t] = bytesToDataURL(r, "image/jpeg");
      } else if (jb.k==="mini"){
        const r = await xShrinkJpeg(b64ToBytes(jb.e.minis[jb.j]), 600, 600, 0.75);
        if (r) jb.e.minis[jb.j] = bytesToDataURL(r, "image/jpeg");
      }
    }catch(e){ /* 失敗した画像は元のまま */ }
  }
}
/* 起動時に一度だけ: 旧形式のデータを最適化して保存し直す（途中で閉じても次回やり直す） */
const fmtReady = Promise.all([bgReady, tierBgReady, btnReady, xReady]).then(async ()=>{
  let lock = null;
  try{
    if ((await idbGet(FMT_KEY)) === FMT_VER){ fmtOK = true; return; }
    const keys = await idbKeys();
    if (!keys.some((k)=>k!==FMT_KEY)) return;          /* データなし */
    xBusy_(true);
    try{ if (navigator.wakeLock) lock = await navigator.wakeLock.request("screen"); }catch(e){}
    await xOptimizeImages();                            /* 画像を表示に必要な大きさへ */
    xBusy_(true, "データを保存しています…");
    await rebuildDatabase();                            /* すべてをバイナリで保存し直し、残骸も消す */
    if (view!=="home") xRerenderKeep();
  }catch(e){}
  finally{
    xBusy_(false);
    try{ if (lock) await lock.release(); }catch(e){}
  }
});

/* ================================================================
   AWARD × ARCHIVE
   ・AWARDの和名はARCHIVEの施設から選ぶ（枠には施設id(sid)と施設名の控えを保存）
   ================================================================ */
function awardSidOf(e){
  return (e && e.sid && aOf(e.sid)) ? e.sid : "";
}
function awardLinkedSlots(id){
  const out = [];
  for (const T of TIERS){
    (cache[T.id]||[]).forEach((e,i)=>{ if (e && awardSidOf(e)===id) out.push({ t:T.id, i, e }); });
  }
  return out;
}
function awardTiersOf(id){
  return TIERS.filter((T)=>(cache[T.id]||[]).some((e)=>e && awardSidOf(e)===id));
}
/* ARCHIVEカード: 所在地の下に設定されているTIERを表示 */
function awardTiersHTML(id){
  const ts = awardTiersOf(id);
  if (!ts.length) return "";
  return `<p class="x-ctier">${ts.map((T)=>`<span class="romaji">TIER <span class="num-gold">${T.roman}</span></span>`).join("")}</p>`;
}
/* AWARDのTier1〜3をすべて読み込む（ARCHIVEのTIER表示用） */
let awardLoading = null;
function ensureAward(){
  if ([1,2,3].every((t)=>cache[t])) return Promise.resolve();
  if (!awardLoading){
    awardLoading = Promise.all([1,2,3].map(async (t)=>{ if (!cache[t]) cache[t] = await loadTier(t); }))
      .then(()=>{ awardLoading = null; if (view==="archive" || view==="adetail") xRerenderKeep(); });
  }
  return awardLoading;
}
/* AWARD設定画面の「サウナ施設名（和名）」欄 */
function awardTitleField(e, i){
  const sid = awardSidOf(e);
  const s = aOf(sid);
  let inner;
  if (s){
    const u = aImgURL(s);
    inner = `${u ? `<img class="x-thumb" src="${u}" alt="" loading="lazy" decoding="async">` : `<span class="x-thumb ph">${XI.sauna}</span>`}
      <span class="x-etext"><span class="x-nm">${esc(s.name)}</span>${s.pref?`<span class="x-lc">${XI.pin}${esc(shortPref(s.pref))}</span>`:""}</span>`;
  } else if (e && e.title){
    /* ARCHIVEとつながっていない施設名（ARCHIVE側で削除された場合など） */
    inner = `<span class="x-etext"><span class="x-nm">${esc(e.title)}</span><span class="x-lc x-warn">ARCHIVEから選択されていません</span></span>`;
  } else {
    inner = `<span class="x-pick-ph">ARCHIVEから選択</span>`;
  }
  return `
  <div class="x-awfield">
    <button class="x-field x-pick" data-x="aw-pick" data-slot="${i}" aria-label="No.${i+1} のサウナ施設名をARCHIVEから選択">
      <span class="x-pick-main">${inner}</span><span class="x-chev">${XI.right}</span>
    </button>
    <button class="x-link x-newlink" data-x="aw-new" data-slot="${i}">ARCHIVEにないサウナを登録する</button>
  </div>`;
}
/* ARCHIVEの施設を和名に設定して保存（入力途中のローマ字などもあわせて保存） */
async function awardPick(slot, id){
  const it = aOf(id);
  if (!it || view!=="settingsTier") return;
  const next = readSlotInputs(slot);
  next.title = it.name.slice(0,MAX_TITLE);
  next.sid = it.id;
  const y = window.scrollY;
  await persistSlot(slot, next);
  render(); window.scrollTo(0,y);
  setStatus(slot, "SAVED ✓");
}
/* ARCHIVEにないサウナ → ARCHIVEの登録画面へ（戻り先はAWARD設定画面） */
async function awardGoNewSauna(slot, prefill){
  const cur = readSlotInputs(slot);
  if (!isEmpty(cur)) await persistSlot(slot, cur);   /* 入力途中の内容を保存してから移動 */
  xs.awSlot = slot; xs.awTier = activeTier; xs.awY = window.scrollY;
  xs.aOrigin = "award"; xs.aEditId = null;
  aNewDraft({ name:(prefill||"").slice(0,MAX_TITLE) });
  xShow("areg");
}

function xBack(){
  if (view==="daialy" || view==="archive") go("home");
  else if (view==="dreg") dCancel();
  else if (view==="adetail") xShow("archive", xs.aY);
  else if (view==="areg") aCancel();
}

/* ================================================================
   イベント（本体とは data-x 属性で区別）
   ================================================================ */
document.addEventListener("click", (ev)=>{
  if (ev.target===xSheet){ xCloseSheet(); return; }
  const el = ev.target.closest ? ev.target.closest("[data-x]") : null;
  if (!el) return;
  const act = el.getAttribute("data-x");
  switch (act){
    case "open-daialy":
      view = "daialy"; render(); window.scrollTo(0,0);
      if (xs.mode==="list") dScrollToSel(false);
      return;
    case "open-archive": xShow("archive"); return;

    /* DAIALY */
    case "d-today": {
      const t = new Date();
      xs.y = t.getFullYear(); xs.m = t.getMonth(); xs.sel = ymd(t);
      render();
      if (xs.mode==="list") dScrollToSel(true); else window.scrollTo({ top:0, behavior:"smooth" });
      return;
    }
    case "d-prev": case "d-next": dChangeMonth(act==="d-next" ? 1 : -1); return;
    case "d-mode-cal": case "d-mode-list": {
      const mode = act==="d-mode-cal" ? "cal" : "list";
      if (xs.mode===mode) return;          /* 表示中の場合は反応なし */
      xs.mode = mode; render();
      if (mode==="list") dScrollToSel(false); else window.scrollTo(0,0);
      return;
    }
    case "d-select":
      if (xs.sel===el.getAttribute("data-date")) return;
      xs.sel = el.getAttribute("data-date"); xRerenderKeep(); return;
    case "d-add": dOpenReg(null); return;
    case "d-open": { const e = dEntries.find((x)=>x.id===el.getAttribute("data-id")); if (e) dOpenReg(e); return; }
    case "d-cancel": dCancel(); return;
    case "d-submit": dSubmit(); return;
    case "d-delete": dRemove(); return;
    case "d-pick": dCaptureDate(); xOpenSaunaPicker("daialy"); return;
    case "aw-pick": xOpenSaunaPicker("award", Number(el.getAttribute("data-slot"))); return;
    case "aw-new": awardGoNewSauna(Number(el.getAttribute("data-slot")), ""); return;
    case "d-new": dGoNewSauna(""); return;
    case "sp-pick": {
      const target = xPicker && xPicker.target, slot = xPicker && xPicker.slot;
      xCloseSheet();
      if (target==="award"){ awardPick(slot, el.getAttribute("data-id")); return; }
      xs.dDraft.sid = el.getAttribute("data-id"); xs.dDraft.name = ""; xs.dDraft.loc = "";
      xRerenderKeep(); return;
    }
    case "sp-new": {
      const q = ((document.getElementById("x-spq") || {}).value || "").trim();
      const target = xPicker && xPicker.target, slot = xPicker && xPicker.slot;
      xCloseSheet();
      if (target==="award") awardGoNewSauna(slot, q); else dGoNewSauna(q);
      return;
    }

    /* ARCHIVE */
    case "a-to-list": aScrollToListTop(true); return;
    case "a-search": aApplySearch(); return;
    case "a-clear-search": aResetSearch(); render(); aScrollToListTop(false); return;
    case "a-add":
      xs.aY = window.scrollY; xs.aOrigin = "archive"; xs.aEditId = null;
      aNewDraft(); xShow("areg"); return;
    case "a-detail":
      xs.aY = window.scrollY; xs.detailId = el.getAttribute("data-id"); xShow("adetail"); return;
    case "a-back": xShow("archive", xs.aY); return;
    case "a-edit": {
      const it = aOf(xs.detailId);
      if (!it) return;
      xs.aOrigin = "detail"; xs.aEditId = it.id;
      aNewDraft({ name:it.name, pref:it.pref||"", star:it.star ? 1 : 0, img:it.img || null });
      xShow("areg"); return;
    }
    case "a-delete": aRemove(); return;
    case "a-cancel": aCancel(); return;
    case "a-submit": aSubmit(); return;
    case "a-img-clear": aSetDraftImg(null); xRerenderKeep(); return;

    /* 地域・星の選択シート */
    case "pk-pref-search": xOpenPicker("pref","search"); return;
    case "pk-star-search": xOpenPicker("star","search"); return;
    case "pk-pref-draft": xOpenPicker("pref","draft"); return;
    case "pk-star-draft": xOpenPicker("star","draft"); return;
    case "pk-cancel": xCloseSheet(); return;
    case "pk-ok": xCommitPicker(); return;
    case "pk-none": if (xPicker){ xPicker.sel.clear(); xCommitPicker(); } return;
    case "pk-clear":
      if (!xPicker) return;
      xPicker.sel.clear();
      xSheet.querySelectorAll(".on").forEach((n)=>n.classList.remove("on"));
      return;
    case "pk-pref": case "pk-star": {
      if (!xPicker) return;
      const v = act==="pk-pref" ? el.getAttribute("data-pref") : Number(el.getAttribute("data-star"));
      if (xPicker.multi){
        if (xPicker.sel.has(v)) xPicker.sel.delete(v); else xPicker.sel.add(v);
        el.classList.toggle("on", xPicker.sel.has(v));
      } else {
        xPicker.sel = new Set([v]);
        xCommitPicker();
      }
      return;
    }
  }
});
document.addEventListener("input", (ev)=>{
  const id = ev.target.id;
  if (id==="x-sq") aSearch.q = ev.target.value;
  else if (id==="x-spq") xRefreshSaunaList();
  else if (id==="x-date") dCaptureDate();
  else if (id==="x-aname" && aDraft){
    aDraft.name = ev.target.value;
    const b = document.getElementById("x-asubmit");
    if (b) b.classList.toggle("off", !aDraft.name.trim());
  }
});
document.addEventListener("keydown", (ev)=>{
  if (ev.key!=="Enter") return;
  if (ev.target.id==="x-sq"){ ev.preventDefault(); aApplySearch(); }
  if (ev.target.id==="x-spq"){ ev.preventDefault(); ev.target.blur(); }
});
document.addEventListener("change", async (ev)=>{
  if (ev.target.id==="x-date"){ dCaptureDate(); return; }
  if (ev.target.id==="x-sort"){ aSort = ev.target.value; xRerenderKeep(); return; }
  if (ev.target.id!=="x-aimg") return;
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  try{
    const img = await decodeViaImg(await fileToDataURL(file));
    /* カード表示に必要な解像度(1080×720)・画質で保存し、容量を抑える */
    openCropper(img, { ar:2/3, outW:960, outH:640, q:0.8, steps:[0.7,0.6,0.5], maxLen:280000,
      onDone:(out)=>{ if (aDraft){ aSetDraftImg(dataURLtoBytes(out).buffer, out); xRerenderKeep(); } } });
  }catch(e){ xToast("この画像は読み込めませんでした"); }
});



/* ---------------- スワイプ操作 ----------------
   ・左→右スワイプで前の画面へ戻る（進む操作はなし）
   ・DAIALY（月表示・リスト表示）では、左右スワイプで月を切り替える。
     画面の左端から右へスワイプした場合のみ「戻る」
   ・切り抜き・ポップアップ・選択シート表示中は無効 */
function goBack(){
  const map = { tiers:"home", settingsTiers:"home", tierView:"tiers", settingsTier:"settingsTiers" };
  if (map[view]){ go(map[view]); return; }
  if (xIsView(view)) xBack();
}
let swipeStart = null;
document.addEventListener("touchstart",(ev)=>{
  const cropOpen = document.getElementById("cropper").classList.contains("open");
  const modalOpen = document.getElementById("modal").classList.contains("open");
  const sheetOpen = document.getElementById("x-sheet").classList.contains("open");
  const onInput = ev.target && ev.target.closest && ev.target.closest("input,select");
  if (cropOpen || modalOpen || sheetOpen || onInput || ev.touches.length!==1){ swipeStart = null; return; }
  const t = ev.touches[0];
  swipeStart = { x:t.clientX, y:t.clientY, time:Date.now(), edge:t.clientX < 28 };
},{passive:true});
document.addEventListener("touchend",(ev)=>{
  if (!swipeStart) return;
  const s0 = swipeStart; swipeStart = null;
  const t = ev.changedTouches[0];
  const dx = t.clientX - s0.x;
  const dy = Math.abs(t.clientY - s0.y);
  const dt = Date.now() - s0.time;
  if (dy >= 60 || dt >= 800 || Math.abs(dx) < dy*1.5) return;   /* 縦スクロールは無視 */
  if (view==="daialy" && !s0.edge){
    if (Math.abs(dx) > 60) dChangeMonth(dx < 0 ? 1 : -1);
    return;
  }
  /* 左→右へ80px以上で戻る */
  if (dx > 80) goBack();
},{passive:true});

function render(){
  showBanner();
  if (view==="home") root.innerHTML = homeHTML();
  else if (view==="tiers") root.innerHTML = tiersHTML(false);
  else if (view==="settingsTiers") root.innerHTML = tiersHTML(true);
  else if (view==="tierView") root.innerHTML = tierViewHTML();
  else if (view==="settingsTier") root.innerHTML = settingsHTML();
  else if (xIsView(view)) root.innerHTML = xRender();
  if (!xIsView(view)) xLastKey = "";
  /* 背景画像: トップ/AWARD/設定画面のみに適用 */
  const bgEl = document.getElementById("bgimg");
  if (bgEl){
    const showBg = appBg && (view==="home" || view==="tiers" || view==="settingsTiers");
    if (showBg){
      bgEl.style.backgroundImage = `url('${appBg}')`;
      bgEl.classList.add("on");
      root.style.background = "transparent";
    } else {
      bgEl.classList.remove("on");
      bgEl.style.backgroundImage = "";
      root.style.background = "";
    }
  }
  /* 設定トップでは現在の登録データ量を表示（実データを直接計算） */
  if (view==="settingsTiers"){
    calcDataSize().then((bytes)=>{
      const el = document.getElementById("usage");
      if (el){
        el.textContent = `登録データ容量: ${(bytes/1048576).toFixed(1)} MB（AWARD・DAIALY・ARCHIVE・背景の合計）`;
      }
    }).catch(()=>{});
  }
  /* ティッカーの速度調整（共通関数）。フォント読み込み後にも再調整 */
  tuneMarquees();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(tuneMarquees).catch(()=>{});
}

render();
