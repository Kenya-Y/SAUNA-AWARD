/* ================================================================
   DAIALY の操作
   ================================================================ */
function dSetMonth(y, m){
  const d = new Date(y, m, 1);
  xs.y = d.getFullYear(); xs.m = d.getMonth();
  const t = new Date();
  xs.sel = (t.getFullYear()===xs.y && t.getMonth()===xs.m) ? ymd(t) : ymd(d);
}
/* 月を切り替える（矢印・スワイプ共通） */
function dChangeMonth(delta){
  dSetMonth(xs.y, xs.m + delta);
  xs.slide = delta > 0 ? "next" : "prev";
  render();
  window.scrollTo(0,0);
}
function dScrollToSel(smooth){
  const el = document.getElementById("x-row-"+xs.sel);
  const hdr = document.querySelector(".x-hdr");
  if (!el) return;
  const top = el.getBoundingClientRect().top + window.scrollY - (hdr ? hdr.offsetHeight : 0) - 6;
  window.scrollTo({ top:Math.max(0,top), behavior: smooth ? "smooth" : "auto" });
}
function dCaptureDate(){
  const el = document.getElementById("x-date");
  if (el && /^\d{4}-\d{2}-\d{2}$/.test(el.value) && xs.dDraft) xs.dDraft.date = el.value;
  /* 予定の終了日。開始日より前になったら開始日にそろえる */
  const e2 = document.getElementById("x-date2");
  if (e2 && xs.dDraft){
    if (/^\d{4}-\d{2}-\d{2}$/.test(e2.value)) xs.dDraft.end = e2.value;
    if (!xs.dDraft.end || xs.dDraft.end < xs.dDraft.date){ xs.dDraft.end = xs.dDraft.date; e2.value = xs.dDraft.date; }
    e2.min = xs.dDraft.date;
  }
}
function dOpenReg(entry){
  xs.dY = window.scrollY;
  if (entry){
    const s = aOf(entry.sid);
    xs.dEditId = entry.id;
    if (dIsEvent(entry)) xs.dDraft = { date:entry.date, end:dIsSpan(entry)?entry.end:"", kind:"ev", sid:null, name:"", loc:"", ev:entry.ev };
    else xs.dDraft = s ? { date:entry.date, kind:"sauna", sid:s.id, name:"", loc:"", ev:"" }
                       : { date:entry.date, kind:"sauna", sid:null, name:entry.name||"", loc:entry.loc||"", ev:"" };
  } else {
    xs.dEditId = null;
    xs.dDraft = { date:xs.sel, kind:"sauna", sid:null, name:"", loc:"", ev:"" };
  }
  xShow("dreg");
}
function dCancel(){ xs.dEditId = null; xs.dDraft = null; xShow("daialy", xs.dY); }
/* ARCHIVEにないサウナ → ARCHIVEの登録画面へ（戻り先はDAIALY登録画面） */
function dGoNewSauna(prefill){
  dCaptureDate();
  xs.aOrigin = "dreg";
  xs.aEditId = null;
  aNewDraft({ name:(prefill||"").slice(0,MAX_TITLE) });
  xShow("areg");
}
function dCaptureEv(){
  const el = document.getElementById("x-evt");
  if (el && xs.dDraft) xs.dDraft.ev = el.value;
}
async function dSubmit(){
  dCaptureDate(); dCaptureEv();
  const dd = xs.dDraft;
  let rec;
  if (dd.kind==="ev"){
    const t = (dd.ev||"").trim().slice(0, D_EV_MAX);
    if (!t){ xToast("予定を入力してください"); return; }
    rec = { ev:t };
    if (dd.end && dd.end > dd.date){
      if (dDaysBetween(dd.date, dd.end) > D_SPAN_MAX-1){ xToast(`予定の期間は${D_SPAN_MAX}日以内にしてください`); return; }
      rec.end = dd.end;
    }
  } else {
    const s = aOf(dd.sid);
    if (!s && !dd.name){ xToast("ARCHIVEからサウナを選択してください"); return; }
    rec = s ? { sid:s.id } : { name:dd.name, loc:dd.loc||"" };
  }
  const word = dd.kind==="ev" ? "予定" : "記録";
  const wasEdit = !!xs.dEditId;
  if (wasEdit){
    const i = dEntries.findIndex((x)=>x.id===xs.dEditId);
    if (i>=0) dEntries[i] = Object.assign({ id:dEntries[i].id, date:dd.date }, rec);
  } else {
    dEntries.push(Object.assign({ id:xNewId(), date:dd.date }, rec));
  }
  const ok = await dSave();
  const prevMonth = xs.y + "-" + xs.m;
  const d = parseYmd(dd.date);
  xs.y = d.getFullYear(); xs.m = d.getMonth(); xs.sel = dd.date;
  xs.dEditId = null; xs.dDraft = null;
  view = "daialy"; render();
  if (xs.mode==="list") dScrollToSel(false);
  else window.scrollTo(0, prevMonth===(xs.y+"-"+xs.m) ? xs.dY : 0);
  xToast(ok ? (wasEdit ? `${word}を更新しました` : `${word}を登録しました`) : "保存できませんでした");
}
async function dRemove(){
  const e = dEntries.find((x)=>x.id===xs.dEditId);
  if (!e) return;
  const yes = await showConfirm(`「${esc(dInfo(e).name)}」の記録を削除しますか？`, "削除する", "戻る");
  if (!yes) return;
  dEntries = dEntries.filter((x)=>x.id!==e.id);
  await dSave();
  dCancel();
  xToast("記録を削除しました");
}

function aScrollToListTop(smooth){
  const el = document.getElementById("x-listsec");
  if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY, behavior: smooth ? "smooth" : "auto" });

function aApplySearch(){

  if (inp){ aSearch.q = inp.value; inp.blur(); }

  aApplied = (q || aSearch.prefs.length || aSearch.star.length)
    ? { q, prefs:aSearch.prefs.slice(), star:aSearch.star.slice() } : null;

function aResetSearch(){ aSearch = { q:"", prefs:[], star:[] }; aApplied = null; }
/* 登録画面の下書き。画像はプレビュー用URLを都度作成し、閉じるときに解放する */
function aNewDraft(base){
  aDropDraft();
  aDraft = { name:"", pref:"", star:0, img:null, preview:"" };
  Object.assign(aDraft, base || {});
  if (aDraft.img) aDraft.preview = bytesToDataURL(new Uint8Array(aDraft.img), "image/jpeg");
}
function aSetDraftImg(buf, url){
  aDraft.img = buf || null;
  aDraft.preview = buf ? (url || bytesToDataURL(new Uint8Array(buf), "image/jpeg")) : "";
}
function aDropDraft(){ aDraft = null; }
function aCancel(){
  xs.aEditId = null;
  aDropDraft();
  if (xs.aOrigin==="dreg") xShow("dreg");
  else if (xs.aOrigin==="award"){ activeTier = xs.awTier; xShow("settingsTier", xs.awY); }
  else if (xs.aOrigin==="detail") xShow("adetail");
  else xShow("archive", xs.aY);
}
async function aSubmit(){
  if (xBusy) return;
  const name = aDraft.name.trim().slice(0,MAX_TITLE);
  if (!name){ xToast("サウナ施設名を入力してください"); return; }
  xBusy = true;
  const editing = xs.aEditId;
  let it, imgChanged = false, ok = true;
  if (editing){
    it = aOf(editing);
    if (!it){ xBusy = false; return; }
    imgChanged = it.img !== aDraft.img;
    await ensureAward();
    const awLinked = awardLinkedSlots(it.id);   /* 名前を変える前に、つながっているAWARDの枠を控える */
    Object.assign(it, { name, pref:aDraft.pref, star:aDraft.star ? 1 : 0, img:aDraft.img || null });
    for (const { t, i, e } of awLinked){

/* ================================================================
   保存形式の移行（ver3.2）: 旧形式のデータを一度だけ作り直して容量を削減
   ================================================================ */
function xBusy_(on, msg){
  const b = document.getElementById("x-busy");
  const m = document.getElementById("x-busy-msg");
  if (m) m.innerHTML = msg || "データを最適化しています…";
  if (b) b.classList.toggle("on", !!on);
}
/* JPEGの縦横サイズをヘッダーから読む（画像を展開せずに判定できる） */
function jpegDims(u8){
  if (!u8 || u8[0]!==0xFF || u8[1]!==0xD8) return null;
  let i = 2;
  while (i+9 < u8.length){
    if (u8[i]!==0xFF){ i++; continue; }
    const m = u8[i+1];
    if (m>=0xC0 && m<=0xCF && m!==0xC4 && m!==0xC8 && m!==0xCC) return { h:(u8[i+5]<<8)|u8[i+6], w:(u8[i+7]<<8)|u8[i+8] };
    if (m===0xD8 || m===0x01 || (m>=0xD0 && m<=0xD7)){ i += 2; continue; }
    i += 2 + ((u8[i+2]<<8)|u8[i+3]);
  }
  return null;
}
function b64ToBytes(dataUrl){
  const bin = atob(dataUrl.slice(dataUrl.indexOf(",")+1));
  const u = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return u;
}
/* 表示に必要な大きさを超える画像だけ縮小。小さくならなければ元のまま（null） */
async function xShrinkJpeg(u8, maxW, maxH, q){
  const d = jpegDims(u8);
  if (!d || (d.w <= maxW && d.h <= maxH)) return null;
  const sc = Math.min(maxW/d.w, maxH/d.h);
  const w = Math.max(1, Math.round(d.w*sc)), h = Math.max(1, Math.round(d.h*sc));
  let src = null;
  try{ if (typeof createImageBitmap==="function") src = await createImageBitmap(new Blob([u8], { type:"image/jpeg" })); }catch(e){}
  if (!src) src = await decodeViaImg(bytesToDataURL(u8, "image/jpeg"));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(src, 0, 0, w, h);
  if (src.close) src.close();
  const out = b64ToBytes(c.toDataURL("image/jpeg", q));
  c.width = c.height = 0;
  return out.length < u8.length ? out : null;
}
async function xOptimizeImages(){
  const jobs = [];
  for (const it of aItems) if (it.img) jobs.push({ k:"arc", it });
  if (appBg) jobs.push({ k:"bg" });
  for (const t of [1,2,3]) if (tierBgs[t] && tierBgs[t]!=="none") jobs.push({ k:"tbg", t });
  for (const T of TIERS){
    const arr = cache[T.id] || await loadTier(T.id);
    cache[T.id] = arr;
    arr.forEach((e,i)=>{ if (e && e.minis) e.minis.forEach((m,j)=>{ if (m) jobs.push({ k:"mini", e, j }); }); });
  }
  for (let n=0; n<jobs.length; n++){
    const jb = jobs[n];
    xBusy_(true, `データを最適化しています<br>${n+1} / ${jobs.length}`);
    try{
      if (jb.k==="arc"){
        const r = await xShrinkJpeg(new Uint8Array(jb.it.img), 960, 640, 0.8);
        if (r){ jb.it.img = r.buffer; aRevoke(jb.it.id); }
      } else if (jb.k==="bg"){
        const r = await xShrinkJpeg(b64ToBytes(appBg), 720, 1600, 0.7);
        if (r) appBg = bytesToDataURL(r, "image/jpeg");
      } else if (jb.k==="tbg"){
        const r = await xShrinkJpeg(b64ToBytes(tierBgs[jb.t]), 720, 1600, 0.7);
        if (r) tierBgs[jb.t] = bytesToDataURL(r, "image/jpeg");
      } else if (jb.k==="mini"){
        const r = await xShrinkJpeg(b64ToBytes(jb.e.minis[jb.j]), 600, 600, 0.75);
        if (r) jb.e.minis[jb.j] = bytesToDataURL(r, "image/jpeg");
      }
    }catch(e){ /* 失敗した画像は元のまま */ }
  }
}
/* 起動時に一度だけ: 旧形式のデータを最適化して保存し直す（途中で閉じても次回やり直す） */
const fmtReady = Promise.all([bgReady, tierBgReady, btnReady, xReady, dBgReady]).then(async ()=>{
  let lock = null;
  try{
    if ((await idbGet(FMT_KEY)) === FMT_VER){ fmtOK = true; return; }
    const keys = await idbKeys();
    if (!keys.some((k)=>k!==FMT_KEY)) return;          /* データなし */
    xBusy_(true);
    try{ if (navigator.wakeLock) lock = await navigator.wakeLock.request("screen"); }catch(e){}
    await xOptimizeImages();                            /* 画像を表示に必要な大きさへ */
    xBusy_(true, "データを保存しています…");
    await rebuildDatabase();                            /* すべてをバイナリで保存し直し、残骸も消す */
    if (view!=="home") xRerenderKeep();
  }catch(e){}
  finally{
    xBusy_(false);
    try{ if (lock) await lock.release(); }catch(e){}
  }
});

/* ================================================================
   AWARD × ARCHIVE
   ・AWARDの和名はARCHIVEの施設から選ぶ（枠には施設id(sid)と施設名の控えを保存）
   ================================================================ */
function awardSidOf(e){
  return (e && e.sid && aOf(e.sid)) ? e.sid : "";
}
function awardLinkedSlots(id){
  const out = [];
  for (const T of TIERS){
    (cache[T.id]||[]).forEach((e,i)=>{ if (e && awardSidOf(e)===id) out.push({ t:T.id, i, e }); });
  }
  return out;
}
function awardTiersOf(id){
  return TIERS.filter((T)=>(cache[T.id]||[]).some((e)=>e && awardSidOf(e)===id));
}
/* ARCHIVEカード: 所在地の下に設定されているTIERを表示 */
function awardTiersHTML(id){
  const ts = awardTiersOf(id);
  if (!ts.length) return "";
  return `<p class="x-ctier">${ts.map((T)=>`<span class="romaji">TIER <span class="num-gold">${T.roman}</span></span>`).join("")}</p>`;
}
/* AWARDのTier1〜3をすべて読み込む（ARCHIVEのTIER表示用） */
let awardLoading = null;
function ensureAward(){
  if ([1,2,3].every((t)=>cache[t])) return Promise.resolve();
  if (!awardLoading){
    awardLoading = Promise.all([1,2,3].map(async (t)=>{ if (!cache[t]) cache[t] = await loadTier(t); }))
      .then(()=>{ awardLoading = null; if (view==="archive" || view==="adetail" || view==="dash") xRerenderKeep(); });
  }
  return awardLoading;
}

/* =====================================================================
   DASHBOARD（ver3.5〜）
   ---------------------------------------------------------------------
   ・集計元はDAIALYの記録。期間は「合計（2020年1月〜今日）」または「年（1月〜12月）」
   ① その期間に行った施設の数（とのべ回数）
   ② あなたのトップサウナ: 回数の多い順（合計は10位まで、年は3位まで）
      同じ回数のときは TIER I → TIER II → TIER III（各TierはAWARDの1〜7の順）
      → 星あり → 星なし（それぞれ登録順）
   ③ ②の結果を施設名・回数つきのリストで表示
   ④ あなたのサウナ分布: 行った都道府県を日本地図で表示＋上位3都道府県
   ⑤ 年: 月ごとの回数 / 合計: 年ごとの回数（2020年〜今年）を棒グラフで表示
   ===================================================================== */
const DASH_FROM_YEAR = 2020;

const dashNow = new Date();
xs.dashYear = "all";                          /* 初期表示は合計。数値=その年 */

/* 集計範囲（ver3.6〜）
   ・合計    : DAIALYの最古の記録 〜 今日
   ・2019以前: DAIALYの最古の記録 〜 2019年12月31日
   ・各年    : その年の1月1日 〜 12月31日 */
function dashRange(){
  if (xs.dashYear==="all") return ["0000-01-01", ymd(new Date())];
  if (xs.dashYear==="pre") return ["0000-01-01", `${DASH_FROM_YEAR-1}-12-31`];
  return [`${xs.dashYear}-01-01`, `${xs.dashYear}-12-31`];
}
function dashEntries(){
  const [a,b] = dashRange();
  return dEntries.filter((e)=>!dIsEvent(e) && e.date>=a && e.date<=b);   /* サウナ以外の予定は集計しない */
}
const dashPrefFromShort = (s)=>!s ? "" : (PREF_ORDER.find((p)=>p===s || shortPref(p)===s) || "");
/* 施設ごとの回数（ARCHIVEにない記録は施設名ごとにまとめる） */
function dashCount(list){
  const map = new Map();
  for (const e of list){
    const it = aOf(e.sid);
    const k = it ? it.id : "n:" + (e.name || "（施設名なし）");
    const cur = map.get(k) || { k, it, name: it ? it.name : (e.name || "（施設名なし）"), loc: it ? "" : (e.loc||""), c:0 };
    cur.c++;
    map.set(k, cur);
  }

/* 同じ回数のときの順番: TIER I→II→III（AWARDの1〜7の順）→ 星あり → 星なし（登録順）*/
function dashRanking(list){
  const pos = {};
  for (const T of TIERS){
    (cache[T.id]||[]).forEach((e,i)=>{ const sid = awardSidOf(e); if (sid && pos[sid]===undefined) pos[sid] = T.id*10 + i; });
  }
  const tie = (r)=>{
    if (!r.it) return [3, 0];
    if (pos[r.it.id]!==undefined) return [0, pos[r.it.id]];
    return [r.it.star>0 ? 1 : 2, r.it.at];
  };
  return dashCount(list).sort((a,b)=>{
    if (b.c!==a.c) return b.c - a.c;
    const ta = tie(a), tb = tie(b);
    return ta[0]-tb[0] || ta[1]-tb[1];
  });
}
function dashPrefCounts(list){
  const cnt = {};
  for (const e of list){
    const it = aOf(e.sid);
    const p = it ? it.pref : dashPrefFromShort(e.loc);
    if (p) cnt[p] = (cnt[p]||0) + 1;

}

/* ⑥ TIER・星の比率（円グラフ）: 選択中の期間のサ活（回数）を、施設の区分ごとに集計。
   区分は TIER I → TIER II → TIER III → 星あり → 星なし の順に判定（1回のサ活は1つの区分に入る） */
const DASH_PIE = [
  { k:"t1", label:"TIER Ⅰ", color:"#E9CD76" },
  { k:"t2", label:"TIER Ⅱ", color:"#C8CFDA" },
  { k:"t3", label:"TIER Ⅲ", color:"#C48B5C" },
  { k:"st", label:"星あり", color:"#63B4F0" },
  { k:"no", label:"星なし", color:"#5A6672" }
];
function dashPieCounts(list){
  const c = { t1:0, t2:0, t3:0, st:0, no:0 };
  const memo = new Map();
  for (const e of list){
    const it = aOf(e.sid);
    let k = "no";
    if (it){
      k = memo.get(it.id);
      if (!k){
        const ts = awardTiersOf(it.id);
        k = ts.length ? "t" + Math.min(...ts.map((T)=>T.id)) : (it.star ? "st" : "no");
        memo.set(it.id, k);
      }
    }
    c[k]++;
  }
  return c;
}
function dashPieHTML(list){
  const total = list.length;
  if (!total) return `<p class="d2-maploading">この期間の記録はありません</p>`;
  const c = dashPieCounts(list);
  const R = 15.9155;   /* 円周がちょうど100になる半径 */
  let acc = 0, arcs = "";
  for (const p of DASH_PIE){
    const v = c[p.k] / total * 100;
    if (v > 0){
      const gap = (v < 100 && v > 1.2) ? 0.6 : 0;
      arcs += `<circle cx="21" cy="21" r="${R}" fill="none" stroke="${p.color}" stroke-width="6.4" stroke-dasharray="${(v-gap).toFixed(3)} ${(100-v+gap).toFixed(3)}" stroke-dashoffset="${(25-acc).toFixed(3)}"></circle>`;
    }
    acc += v;
  }
  const pct = (n)=>{ const v = n/total*100; return (v>0 && v<0.1) ? "0.1" : (Math.round(v*10)/10).toFixed(1); };
  const rows = DASH_PIE.map((p)=>`
    <li class="${c[p.k]?"":"zero"}"><i style="background:${p.color}"></i><span class="l">${p.label}</span><span class="c">${dashFmt(c[p.k])}回</span><span class="p">${pct(c[p.k])}%</span></li>`).join("");
  return `
  <div class="d2-pie">
    <div class="d2-piechart">
      <svg viewBox="0 0 42 42" role="img" aria-label="TIER・星の比率">
        <circle cx="21" cy="21" r="${R}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="6.4"></circle>${arcs}
      </svg>
      <div class="d2-piemid"><b>${dashFmt(total)}</b><span>回</span></div>
    </div>
    <ul class="d2-pielegend">${rows}</ul>
  </div>`;
}

  const bars = values.map((v)=>`
    <div class="d2-bar"><span class="v ${v?"":"zero"}">${v}</span><i class="${v?"":"zero"}" style="height:${v ? Math.max(6, Math.round(v/max*140)) : 3}px"></i></div>`).join("");
  const labs = labels.map((l,i)=>`<span class="${i===curIdx?"cur":""}">${l}</span>`).join("");
  return `<div class="d2-bars">${bars}</div><div class="d2-blabels">${labs}</div>`;
}

function dashHTML(){
  const all = xs.dashYear==="all";
  const pre = xs.dashYear==="pre";
  const preLabel = `${DASH_FROM_YEAR-1}以前`;
  const list = dashEntries();
  const rank = dashRanking(list);
  const top = rank.slice(0, all ? 10 : 3);
  const nowY = new Date().getFullYear();
  const years = []; for (let y=nowY; y>=DASH_FROM_YEAR; y--) years.push(y);
  const yearSel = `
    <label class="d2-year">
      <select id="x-dyear" aria-label="集計する期間">
        <option value="all" ${all?"selected":""}>合計</option>
        ${years.map((y)=>`<option value="${y}" ${xs.dashYear===y?"selected":""}>${y}</option>`).join("")}
        <option value="pre" ${pre?"selected":""}>${preLabel}</option>
      </select>${XI.down}
    </label>`;
  const head = all ? "今までに" : pre ? `${DASH_FROM_YEAR-1}年以前に` : `${xs.dashYear}年に`;
  const headNone = all ? "まだ" : pre ? `${DASH_FROM_YEAR-1}年以前は` : `${xs.dashYear}年は`;

  /* ① */
  const stmt = list.length
    ? `<p class="d2-stmt">${head}<b>${dashFmt(rank.length)}施設</b>で<br>整いました。</p>
       <p class="d2-sub">のべ<b> ${dashFmt(list.length)} </b>回のサ活</p>`
    : `<p class="d2-stmt">${headNone}<br><b>記録がありません。</b></p>
       <p class="d2-sub">DAIALYに行ったサウナを登録すると、ここに集計されます</p>`;

  /* ② ③ */
  const thumb = (r)=>{ const u = r.it ? aImgURL(r.it) : ""; return u ? `<img class="d2-thumb" src="${u}" alt="" loading="lazy">` : `<span class="d2-thumb">${XI.sauna}</span>`; };
  const cards = top.map((r,i)=>{
    const u = r.it ? aImgURL(r.it) : "";
    return `
    <article class="d2-card">
      ${u ? `<img src="${u}" alt="" loading="lazy">` : `<div class="d2-noimg">${XI.sauna}</div>`}
      <span class="d2-rank">${i+1}</span>
      <div class="d2-cap"><b>${esc(r.name)}</b><span>${dashFmt(r.c)}回</span></div>
    </article>`;
  }).join("");
  const rows = top.map((r,i)=>{
    const pref = r.it ? shortPref(r.it.pref) : r.loc;
    return `
    <div class="d2-row">
      ${thumb(r)}
      <div class="d2-rbody">
        <span class="d2-rn">${i+1}</span>
        <div class="d2-rtext"><div class="d2-rname">${esc(r.name)}</div><div class="d2-rsub">${pref ? esc(pref)+" · " : ""}${dashFmt(r.c)}回</div></div>
      </div>
    </div>`;
  });

  /* ④ */
  const pc = dashPrefCounts(list);
  const prefs = Object.keys(pc).sort((a,b)=>pc[b]-pc[a] || prefRank(a)-prefRank(b));
  const top3 = prefs.slice(0,3).map((p,i)=>`<li><span class="n">${i+1}</span><span class="p">${p}</span><span class="c">${dashFmt(pc[p])}回</span></li>`).join("");

  /* ⑤ */
  let chart, chartTitle;
  const byYear = (y)=>list.filter((e)=>e.date.startsWith(y+"-")).length;
  if (all){
    /* 合計: 「2019以前」（最古の記録〜2019年末）＋ 2020年〜今年 */
    const ys = []; for (let y=DASH_FROM_YEAR; y<=nowY; y++) ys.push(y);
    const preCount = list.filter((e)=>e.date < `${DASH_FROM_YEAR}-01-01`).length;
    const vals = [preCount].concat(ys.map(byYear));
    chart = dashYearBarsHTML(vals, [preLabel].concat(ys.map(String)), vals.length-1);
    chartTitle = "年ごとのサ活";
  } else if (pre){
    /* 2019以前: DAIALYの最古の記録の年 〜 2019年 */
    if (list.length){
      const first = Math.min(...list.map((e)=>Number(e.date.slice(0,4))));
      const ys = []; for (let y=first; y<=DASH_FROM_YEAR-1; y++) ys.push(y);
      chart = dashYearBarsHTML(ys.map(byYear), ys.map(String), -1);
    } else {
      chart = `<p class="d2-maploading">この期間の記録はありません</p>`;
    }
    chartTitle = "年ごとのサ活";
  } else {
    const vals = Array.from({length:12}, (_,m)=>list.filter((e)=>Number(e.date.slice(5,7))===m+1).length);
    const cur = (xs.dashYear===nowY) ? new Date().getMonth() : -1;
    chart = dashBarsHTML(vals, Array.from({length:12},(_,m)=>`${m+1}月`), cur);
    chartTitle = "月ごとのサ活";
  }

  const none = `<p class="d2-empty">この期間の記録はありません</p>`;
  return `
  <div class="d2">
    <div class="d2-glow"></div>
    <header class="d2-hdr"><button class="back" data-go="home">← Top</button></header>
    <div class="d2-titlerow"><h1 class="d2-title">Dashboard</h1>${yearSel}</div>
    ${stmt}
    <section class="d2-sec">
      <h2 class="d2-h">あなたのトップサウナ</h2>
      ${top.length ? `<div class="d2-cards no-swipe">${cards}</div>` : none}
    </section>
    <section class="d2-sec">
      <h2 class="d2-h">ランキング</h2>
      ${!top.length ? none : (all && top.length > 5)
        ? `<div class="d2-lpages no-swipe"><div class="d2-lpage">${rows.slice(0,5).join("")}</div><div class="d2-lpage">${rows.slice(5).join("")}</div></div>`
        : `<div class="d2-list">${rows.join("")}</div>`}
    </section>
    <section class="d2-sec">
      <h2 class="d2-h">あなたのサウナ分布</h2>
      <div class="d2-panel">
        ${dashMapHTML(pc)}
        <div class="d2-maplegend"><span>行った都道府県</span><span><b>${prefs.length}</b>/ 47</span></div>
        ${top3 ? `<ol class="d2-top3">${top3}</ol>` : ""}
      </div>
    </section>
    <section class="d2-sec">
      <h2 class="d2-h">${chartTitle}</h2>
      <div class="d2-panel d2-chart">${chart}</div>
    </section>
    <section class="d2-sec">
      <h2 class="d2-h">TIER・星の比率</h2>
      <div class="d2-panel">${dashPieHTML(list)}</div>
    </section>
  </div>`;
}


/* ---------------- スワイプ操作 ----------------
   ・左→右スワイプで前の画面へ戻る（進む操作はなし）
   ・DAIALY（月表示・リスト表示）では、左右スワイプで月を切り替える。
     画面の左端から右へスワイプした場合のみ「戻る」
   ・切り抜き・ポップアップ・選択シート表示中は無効 */
function goBack(){
  const map = { tiers:"home", settingsTiers:"home", tierView:"tiers", settingsTier:"settingsTiers" };
  if (map[view]){ go(map[view]); return; }
  if (xIsView(view)) xBack();
}
let swipeStart = null;
document.addEventListener("touchstart",(ev)=>{
  const cropOpen = document.getElementById("cropper").classList.contains("open");
  const modalOpen = document.getElementById("modal").classList.contains("open");
  const sheetOpen = document.getElementById("x-sheet").classList.contains("open");
  const onInput = ev.target && ev.target.closest && ev.target.closest("input,select,.no-swipe");
  if (cropOpen || modalOpen || sheetOpen || onInput || ev.touches.length!==1){ swipeStart = null; return; }
  const t = ev.touches[0];
  swipeStart = { x:t.clientX, y:t.clientY, time:Date.now(), edge:t.clientX < 28 };
},{passive:true});
document.addEventListener("touchend",(ev)=>{
  if (!swipeStart) return;
  const s0 = swipeStart; swipeStart = null;
  const t = ev.changedTouches[0];
  const dx = t.clientX - s0.x;
  const dy = Math.abs(t.clientY - s0.y);
  const dt = Date.now() - s0.time;
  if (dy >= 60 || dt >= 800 || Math.abs(dx) < dy*1.5) return;   /* 縦スクロールは無視 */
  if (view==="daialy" && !s0.edge){
    if (Math.abs(dx) > 60) dChangeMonth(dx < 0 ? 1 : -1);
    return;
  }
  /* 左→右へ80px以上で戻る */
  if (dx > 80) goBack();
},{passive:true});

function render(){
  showBanner();
  if (view==="home") root.innerHTML = homeHTML();
  else if (view==="tiers") root.innerHTML = tiersHTML(false);
  else if (view==="settingsTiers") root.innerHTML = tiersHTML(true);
  else if (view==="tierView") root.innerHTML = tierViewHTML();
  else if (view==="settingsTier") root.innerHTML = settingsHTML();
  else if (xIsView(view)) root.innerHTML = xRender();
  if (!xIsView(view)) xLastKey = "";
  if (view==="dash") dashAfterRender();
  /* 背景画像: トップ/AWARD/設定画面のみに適用 */
  const bgEl = document.getElementById("bgimg");
  if (bgEl){
    /* DAIALY（月表示・リスト表示）には「DAIALYの背景設定」の画像を表示 */
    const bgUrl = (view==="daialy") ? dBgURL()
      : (appBg && (view==="home" || view==="tiers" || view==="settingsTiers")) ? appBg : null;
    bgEl.classList.toggle("dim", view==="daialy");
    const hdrBg = view==="daialy" && !!bgUrl;
    document.body.classList.toggle("dbg-on", hdrBg);
    if (hdrBg){
      if (bgEl.__dbg !== bgUrl){ document.documentElement.style.setProperty("--dbg", `url('${bgUrl}')`); bgEl.__dbg = bgUrl; }
    } else if (bgEl.__dbg){ document.documentElement.style.removeProperty("--dbg"); bgEl.__dbg = null; }
    if (bgUrl){
      bgEl.style.backgroundImage = `url('${bgUrl}')`;
      bgEl.classList.add("on");
      root.style.background = "transparent";
      if (typeof syncBgHeight==="function") syncBgHeight();
    } else {
      bgEl.classList.remove("on");
      bgEl.style.backgroundImage = "";
      root.style.background = "";
    }
  }
  /* 設定トップでは現在の登録データ量を表示（実データを直接計算） */
  if (view==="settingsTiers"){
    calcDataSize().then((bytes)=>{
      const el = document.getElementById("usage");
      if (el){
        el.textContent = `登録データ容量: ${(bytes/1048576).toFixed(1)} MB（AWARD・DAIALY・ARCHIVE・背景の合計）`;
      }
    }).catch(()=>{});
  }
  /* ティッカーの速度調整（共通関数）。フォント読み込み後にも再調整 */
  tuneMarquees();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(tuneMarquees).catch(()=>{});
}

/* ヘッダーの背景を画面全体の背景とぴったり重ねるため、背景の高さを控えておく */
function syncBgHeight(){
  const el = document.getElementById("bgimg");
  const h = (el && el.offsetHeight) || window.innerHeight;
  if (h) document.documentElement.style.setProperty("--bgh", h + "px");
}
window.addEventListener("resize", syncBgHeight);
/* フォントが後から届いたら、文字幅に合わせてティッカーの速度を整え直す */
try{ if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", ()=>{ try{ tuneMarquees(); }catch(e){} }); }catch(e){}
window.addEventListener("orientationchange", syncBgHeight);

render();
syncBgHeight();
</script>
